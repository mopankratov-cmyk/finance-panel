name: deploy

# Деплой панели в прод БЕЗ GitHub: push в main → сборка и выкладка через Vercel CLI.
# Заменяет GitHub→Vercel git-интеграцию. Тот же подход уже используется в director-cockpit.
#
# ТРЕБОВАНИЯ:
#   • раннер с меткой `gate` (node ≥18, git, curl — см. deploy/gitea/runner.Dockerfile);
#   • секреты репо: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#     (ORG/PROJECT id берутся из `vercel link` → .vercel/project.json, токен — vercel.com/account/tokens).
#   • crons из vercel.json продолжают работать (они часть деплоя).

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: gate
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Клон репо из Gitea (без github.com)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf repo
          git -c http.extraheader="Authorization: token $TOKEN" \
            clone --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo && git -c http.extraheader="Authorization: token $TOKEN" fetch --depth=1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"

      - name: Деплой в прод (Vercel CLI, удалённая сборка)
        working-directory: repo
        run: |
          set -euo pipefail

          # Версия CLI ПРИБИТА, а не `@latest`.
          #
          # Комментарий прежней версии этого файла сам объяснял, почему выкладка
          # сломалась молча: «раннер ставит vercel@latest, поэтому сломалось в
          # момент изменения вывода CLI». Лечить последствия смены вывода, оставив
          # причину — плавающую версию — значит ждать следующего раза. Обновление
          # версии теперь отдельная осознанная правка этого файла.
          #
          # Установка идемпотентна и умеет чинить себя — иначе она чинится руками.
          # 31.08.2026 глобальную установку оборвали на середине (в host-режиме
          # раннер живёт между прогонами, а `concurrency: cancel-in-progress`
          # гасит идущий прогон при следующем мёрже). npm оставил и целевой
          # каталог, и временный `.vercel-*` — после чего КАЖДЫЙ следующий
          # прогон падал на `ENOTEMPTY: directory not empty` при попытке их
          # переименовать. Выкладка стояла три дня, `vercel` при этом не был
          # установлен вовсе, а прод обновляли руками.
          #
          # Заодно это ускоряет прогон: обычно установка не нужна совсем.
          installed=$(vercel --version 2>/dev/null | tail -1 || true)
          if [ "$installed" != "54.12.2" ]; then
            rm -rf /usr/local/lib/node_modules/vercel /usr/local/lib/node_modules/.vercel-*
            npm i -g --no-audit --no-fund vercel@54.12.2
          fi

          # Удалённая сборка на стороне Vercel (как делала GitHub-интеграция): раннер только
          # заливает исходники, без локального `next build` — не упирается в RAM маленькой VM.
          # VERCEL_ORG_ID/VERCEL_PROJECT_ID из env указывают проект.
          #
          # Вывод пишем в файл и печатаем целиком: если шаг упадёт, его хвост
          # уедет в Telegram (см. последний шаг). Прежде провал был виден только
          # в веб-морде Gitea, а до неё за пять часов никто не дошёл.
          set +e
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/deploy.out 2> /tmp/deploy.err
          rc=$?
          set -e
          cat /tmp/deploy.err
          cat /tmp/deploy.out
          cat /tmp/deploy.err /tmp/deploy.out > /tmp/deploy.log
          if [ "$rc" -ne 0 ]; then
            echo "vercel deploy завершился с кодом $rc"
            exit 1
          fi

          # Привязки алиаса здесь БОЛЬШЕ НЕТ, и это не упрощение, а исправление.
          #
          # `vercel deploy --prod` ставит прод-алиас сам — в выводе прямо
          # `▲ Aliased https://finance-panel-two.vercel.app`. Отдельный
          # `vercel alias set` был лишним шагом, который умел только падать:
          # именно он делал прогон красным ПОСЛЕ успешного деплоя и рождал алерт
          # «прод не обновился» при обновившемся проде. Разбор адреса из текста
          # вывода нужен был только ему — ушёл вместе с ним.
          #
          # Проверено вручную 02.09.2026 на этой самой версии CLI: деплой
          # привязал публичный домен без единой дополнительной команды.

          # Причину провала дописываем в тот же файл, что уедет в Telegram: иначе
          # в алерте окажется хвост УСПЕШНОГО деплоя, и читающий решит, что
          # сломалось что-то другое.
          fail() {
            echo "$1"
            { echo; echo "$1"; } >> /tmp/deploy.log
            exit 1
          }

          # Проверка прода — через API Vercel, а не запросом к *.vercel.app.
          #
          # Прежняя проверка ходила curl'ом на finance-panel-two.vercel.app прямо
          # с этой ВМ, а *.vercel.app из РФ режется по SNI: соединение то
          # проходило, то рвалось (SSL_ERROR_SYSCALL, код 000), и успешная
          # выкладка через раз помечалась failure. Красный статус перестал что-
          # либо значить — настоящий провал утонул бы среди ложных (30.09.2026:
          # #1358, #1363, #1364 выложены и работают, а статус красный).
          # api.vercel.com с ВМ доступен — через него идёт и сам деплой.
          #
          # Главное, что ловила прежняя проверка, — прод-алиас у чужой или
          # устаревшей сборки. Это проверяется напрямую: адрес прода должен
          # указывать на ЭТУ сборку, и она должна быть READY.
          deploy_url=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' /tmp/deploy.out | tail -1 || true)
          [ -n "$deploy_url" ] || fail "Деплой не вернул адрес сборки — нечего сверять с продом"
          alias_json=""
          for attempt in 1 2 3; do
            alias_json=$(vercel inspect finance-panel-two.vercel.app --format json --token="$VERCEL_TOKEN" 2>/tmp/inspect.err) && break
            alias_json=""
            sleep 10
          done
          [ -n "$alias_json" ] || fail "API Vercel не ответил на inspect прод-адреса: $(tail -c 300 /tmp/inspect.err)"
          json_field() {
            printf '%s' "$alias_json" | node -e 'let s="";process.stdin.on("data",(c)=>{s+=c}).on("end",()=>{try{process.stdout.write(String(JSON.parse(s)[process.argv[1]] ?? "-"))}catch{process.stdout.write("-")}})' "$1"
          }
          alias_url=$(json_field url)
          alias_state=$(json_field readyState)
          if [ "https://${alias_url}" != "$deploy_url" ]; then
            fail "Прод-адрес указывает не на эту сборку: ${alias_url} вместо ${deploy_url#https://}"
          fi
          [ "$alias_state" = "READY" ] || fail "Сборка прода не готова: readyState=${alias_state}"
          echo "Прод-адрес указывает на эту сборку (${alias_url}), READY."

          # HTTP-проверка роута — как дополнительная, без ложных провалов.
          # /api/auth/status доступен без сессии и не требует БД-состояния.
          # Ответ получен и не 200 — это настоящий провал (сборка без роута,
          # 5xx). Соединение не установилось (код 000) — это фильтр по SNI на
          # пути с ВМ, а не прод: алиас уже сверен через API выше.
          code=$(curl -sS --max-time 20 -o /tmp/auth-status-canary.json -w "%{http_code}" \
            "https://finance-panel-two.vercel.app/api/auth/status" 2>/tmp/canary.err || true)
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "HTTP-проверка недоступна с этой ВМ ($(tail -c 200 /tmp/canary.err)) — прод сверен через API Vercel."
          elif [ "$code" != "200" ]; then
            fail "Canary после успешного деплоя: HTTP $code на /api/auth/status $(head -c 300 /tmp/auth-status-canary.json 2>/dev/null)"
          else
            echo "HTTP-проверка /api/auth/status: 200."
          fi

          echo "Прод задеплоен и проверен."

      # Провал выкладки был НЕМЫМ. 01.09.2026 чужая ошибка типов влилась в main,
      # сборка легла, и прод простоял пять часов на старой версии — заметил это
      # случайно тот, кто следующим полез выкатываться вручную. Сама выкладка
      # чинится не здесь (сборку до мёржа гейт не гоняет — см. комментарий в
      # ai-gate.yml о том, почему код PR там не исполняется), но молчать о
      # сломанном проде нельзя: за пять часов о нём не узнал никто.
      - name: Провал выкладки — в Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -uo pipefail
          [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || { echo "Telegram не настроен — пропускаю"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Хвост вывода — прямо в сообщение.
          #
          # Ссылка на лог у алерта была и раньше, но 02.09.2026 выкладка падала
          # пять мёржей подряд, и добраться до этой ссылки не смог никто: она
          # ведёт во внутреннюю веб-морду, доступную только с машины владельца.
          # Алерт, который говорит «сломалось, посмотри сам» и не показывает
          # ЧТО сломалось, откладывает разбор ровно настолько, насколько неудобно
          # открыть ссылку. Первые строки причины должны быть в самом сообщении.
          TAIL=$(tail -c 1200 /tmp/deploy.log 2>/dev/null || echo "вывод деплоя не сохранился — шаг упал до его запуска (клон или установка CLI)")
          TEXT=$(printf '🔴 Прод НЕ обновился\n\nВыкладка упала на коммите %s в main.\nПрод остался на предыдущей версии — всё, что влили после, до пользователей не доехало.\n\nХвост вывода:\n%s\n\nЛог: %s' \
            "${GITHUB_SHA:0:8}" "$TAIL" "$RUN_URL")
          # --max-time: api.telegram.org с этой ВМ НЕ ОТКРЫВАЕТСЯ (проверено
          # 03.09.2026 — curl (28) после 135 секунд). Без ограничения каждый
          # провал выкладки висел лишние две минуты на попытке доложить о себе,
          # и ни один алерт при этом не доходил. Ограничение не чинит доставку —
          # оно лишь перестаёт красть время; про недоставку сказано в README.
          curl -fsS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || echo "Telegram не ответил"
