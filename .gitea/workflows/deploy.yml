name: deploy

# Деплой панели в прод БЕЗ GitHub: push в main → сборка и выкладка через Vercel CLI.
# Заменяет GitHub→Vercel git-интеграцию. Тот же подход уже используется в director-cockpit.
#
# ТРЕБОВАНИЯ:
#   • раннер с меткой `gate` (node ≥18, git, curl — см. deploy/gitea/runner.Dockerfile);
#   • секреты репо: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#     (ORG/PROJECT id берутся из `vercel link` → .vercel/project.json, токен — vercel.com/account/tokens).
#   • crons из vercel.json продолжают работать (они часть деплоя).

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: gate
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Клон репо из Gitea (без github.com)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf repo
          git -c http.extraheader="Authorization: token $TOKEN" \
            clone --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo && git -c http.extraheader="Authorization: token $TOKEN" fetch --depth=1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"

      - name: Деплой в прод (Vercel CLI, удалённая сборка)
        working-directory: repo
        run: |
          set -euo pipefail
          npm i -g vercel@latest
          # Удалённая сборка на стороне Vercel (как делала GitHub-интеграция): раннер только
          # заливает исходники, без локального `next build` — не упирается в RAM маленькой VM.
          # VERCEL_ORG_ID/VERCEL_PROJECT_ID из env указывают проект.
          deploy_output=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          printf '%s\n' "$deploy_output"
          url=$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
          test -n "$url"

          # Сначала промоутим публичный alias, потом проверяем именно его.
          # Технический *.vercel.app URL деплоя может быть закрыт Vercel SSO и отдавать 302,
          # хотя публичный production alias уже доступен пользователям.
          vercel alias set "$url" finance-panel-two.vercel.app --token="$VERCEL_TOKEN"

          # Canary: /api/auth/status всегда доступен без сессии и не требует БД-состояния.
          # 404 значит, что промоутнулась чужая/устаревшая сборка — не должна владеть прод-алиасом.
          code=$(curl -sS -o /tmp/auth-status-canary.json -w "%{http_code}" \
            "https://finance-panel-two.vercel.app/api/auth/status")
          if [ "$code" != "200" ]; then
            echo "Auth-status canary failed: HTTP $code"
            cat /tmp/auth-status-canary.json || true
            exit 1
          fi

          echo "Прод задеплоен и canary пройден: $url"

      # Провал выкладки был НЕМЫМ. 01.09.2026 чужая ошибка типов влилась в main,
      # сборка легла, и прод простоял пять часов на старой версии — заметил это
      # случайно тот, кто следующим полез выкатываться вручную. Сама выкладка
      # чинится не здесь (сборку до мёржа гейт не гоняет — см. комментарий в
      # ai-gate.yml о том, почему код PR там не исполняется), но молчать о
      # сломанном проде нельзя: за пять часов о нём не узнал никто.
      - name: Провал выкладки — в Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -uo pipefail
          [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || { echo "Telegram не настроен — пропускаю"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf '🔴 Прод НЕ обновился\n\nВыкладка упала на коммите %s в main.\nПрод остался на предыдущей версии — всё, что влили после, до пользователей не доехало.\n\nЛог: %s' \
            "${GITHUB_SHA:0:8}" "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || echo "Telegram не ответил"
