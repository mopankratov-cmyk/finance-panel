name: quality

# Проверяет именно код PR до слияния. Секреты приложения этому workflow не
# передаются: он устанавливает зависимости, запускает статический анализ,
# тесты и production-сборку.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Один тяжёлый production-build за раз на ВМ. Холодная сборка пикует ~3,3 ГБ, и
# три параллельных next build на 8-ГБ ВМ выбивают память на проверке типов —
# quality краснеет НЕ из-за кода. А раз quality теперь обязательный чек мёржа,
# такой ложно-красный блокирует все PR и провоцирует форс-мёрж мимо гейта (06.10
# так и сломали main). Глобальная очередь: прогоны ждут друг друга, но слот при
# этом не держат (заблокированный concurrency-прогон раннер не занимает).
# cancel-in-progress=false — гасить прогон ДРУГОГО PR нельзя (группа общая).
concurrency:
  group: quality-build
  cancel-in-progress: false

jobs:
  checks:
    runs-on: gate
    # Next запускает финальную проверку TypeScript дочерним Node-процессом
    # после webpack-компиляции. Стандартных 2 ГБ уже недостаточно для дерева
    # приложения; переменная наследуется и сборщиком, и его typecheck worker.
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    # Зависшая проверка держит слот раннера и (при общей очереди) блокирует
    # сборки всех остальных PR — ограничиваем по времени. Норма прогона ~10–12 мин,
    # 30 — запас; раньше было 45, но с очередью один застрявший build дороже.
    timeout-minutes: 30
    steps:
      - name: Клонировать код PR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Без терминала git ждёт ввода логина вечно; пусть падает сразу.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          rm -rf repo
          git -c http.extraheader="Authorization: token $TOKEN" \
            clone --filter=blob:none "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git -c http.extraheader="Authorization: token $TOKEN" fetch --depth=1 origin "$HEAD_SHA"
          # Клон частичный (blob:none): checkout докачивает файлы отдельным
          # запросом к серверу, и ему тоже нужен токен.
          git -c http.extraheader="Authorization: token $TOKEN" checkout --detach "$HEAD_SHA"

      - name: Установить зависимости
        working-directory: repo
        run: npm ci --no-audit --no-fund

      - name: Проверить код
        working-directory: repo
        run: npm run lint

      - name: Запустить тесты
        working-directory: repo
        run: npm test

      - name: Проверить production-сборку
        working-directory: repo
        env:
          # Без кэша сборка на раннере упирается в потолок кучи Node (~2 ГБ на ВМ в 8 ГБ) на этапе проверки типов:
          # «FATAL ERROR: Reached heap limit … JavaScript heap out of memory» → «Failed to type check».
          # Пик по памяти холодной сборки ~3,3 ГБ; потолок поднимаем, чтобы он не был причиной красной проверки.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
