# Самохостинг Gitea + Postgres + Actions-раннер.
# Назначение: (1) канон конфигурации, (2) локальный прогон/тест перед Railway,
# (3) запасной аэродром, если уйдём с Railway на любой VPS.
# На Railway каждый сервис заводится отдельно теми же образами/env (см. README.md).
#
# Запуск локально:  cd deploy/gitea && cp .env.example .env && (заполнить) && docker compose up -d
# Дальше: открыть http://localhost:3000 → завершить установку → создать registration token
#         для раннера → положить его в .env (RUNNER_TOKEN) → docker compose up -d runner

services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__DISABLE_SSH: "true"          # работаем по HTTPS (Railway не даёт удобный SSH)
      GITEA__service__DISABLE_REGISTRATION: "true" # только владелец заводит аккаунты сотрудникам
      GITEA__actions__ENABLED: "true"
      # чтобы `uses:`-экшены (если вдруг понадобятся) шли НЕ через github.com:
      GITEA__actions__DEFAULT_ACTIONS_URL: https://gitea.com
    volumes:
      - gitea-data:/data
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: gitea
    volumes:
      - gitea-db:/var/lib/postgresql/data

  runner:
    build:
      context: .
      dockerfile: runner.Dockerfile
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: ${GITEA_ROOT_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN}
      GITEA_RUNNER_LABELS: gate:host
    volumes:
      - runner-data:/data
    depends_on:
      - gitea

volumes:
  gitea-data:
  gitea-db:
  runner-data:
