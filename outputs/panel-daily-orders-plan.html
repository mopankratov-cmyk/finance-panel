.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #panel-daily-orders-plan {
      --p-bg: light-dark(rgb(245 245 245), rgb(24 24 27));
      --p-card: light-dark(rgb(255 255 255), rgb(31 31 44));
      --p-soft: light-dark(rgb(248 250 252), rgb(39 39 52));
      --p-border: light-dark(rgb(226 232 240), rgb(63 63 70));
      --p-border-soft: light-dark(rgb(241 245 249), rgb(47 47 59));
      --p-text: light-dark(rgb(15 23 42), rgb(241 245 249));
      --p-muted: light-dark(rgb(100 116 139), rgb(161 161 170));
      --p-violet: light-dark(rgb(124 58 237), rgb(167 139 250));
      --p-violet-soft: light-dark(rgb(245 243 255), rgb(46 34 78));
      --p-amber: light-dark(rgb(217 119 6), rgb(251 191 36));
      --p-amber-soft: light-dark(rgb(255 251 235), rgb(69 45 16));
      --p-blue: light-dark(rgb(37 99 235), rgb(96 165 250));
      --p-blue-soft: light-dark(rgb(239 246 255), rgb(30 58 138));
      --p-red: light-dark(rgb(220 38 38), rgb(248 113 113));
      --p-red-soft: light-dark(rgb(254 242 242), rgb(69 26 26));
      --p-green: light-dark(rgb(5 150 105), rgb(52 211 153));
      --p-green-soft: light-dark(rgb(236 253 245), rgb(20 83 45));
      --p-side: rgb(26 26 46);
      color: var(--p-text);
      font-size: var(--font-size-base);
    }

    #panel-daily-orders-plan * {
      box-sizing: border-box;
    }

    #panel-daily-orders-plan button,
    #panel-daily-orders-plan select,
    #panel-daily-orders-plan input {
      font: inherit;
    }

    #panel-daily-orders-plan .shell {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      min-height: 1040px;
      background: var(--p-bg);
      border: 1px solid var(--p-border);
      overflow: hidden;
    }

    #panel-daily-orders-plan .sidebar {
      background: var(--p-side);
      color: rgb(203 213 225);
      display: flex;
      flex-direction: column;
    }

    #panel-daily-orders-plan .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 24px 16px;
      border-bottom: 1px solid rgb(255 255 255 / 10%);
    }

    #panel-daily-orders-plan .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: rgb(196 181 253);
      background: rgb(124 58 237 / 24%);
    }

    #panel-daily-orders-plan .brand strong {
      color: white;
      font-weight: 500;
      display: block;
    }

    #panel-daily-orders-plan .brand span,
    #panel-daily-orders-plan .group {
      color: rgb(148 163 184);
    }

    #panel-daily-orders-plan .nav {
      padding: 14px 12px;
      display: grid;
      gap: 8px;
    }

    #panel-daily-orders-plan .group {
      margin-top: 8px;
      padding: 0 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 11px;
      font-weight: 500;
    }

    #panel-daily-orders-plan .link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 10px;
      color: rgb(203 213 225);
      text-decoration: none;
    }

    #panel-daily-orders-plan .link.active {
      background: rgb(124 58 237 / 20%);
      color: rgb(196 181 253);
    }

    #panel-daily-orders-plan .user {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid rgb(255 255 255 / 10%);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #panel-daily-orders-plan .avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgb(124 58 237 / 30%);
      color: rgb(221 214 254);
      font-weight: 500;
    }

    #panel-daily-orders-plan .main {
      min-width: 0;
      padding: 24px 32px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    #panel-daily-orders-plan .mobile-brand {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--p-border);
      border-radius: 12px;
      background: var(--p-card);
    }

    #panel-daily-orders-plan .head,
    #panel-daily-orders-plan .row,
    #panel-daily-orders-plan .toolbar,
    #panel-daily-orders-plan .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #panel-daily-orders-plan .head {
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    #panel-daily-orders-plan h2,
    #panel-daily-orders-plan h3 {
      margin: 0;
      font-weight: 500;
    }

    #panel-daily-orders-plan .muted {
      color: var(--p-muted);
    }

    #panel-daily-orders-plan .btn,
    #panel-daily-orders-plan .select,
    #panel-daily-orders-plan .input {
      min-height: 36px;
      border: 1px solid var(--p-border);
      border-radius: 9px;
      background: var(--p-card);
      color: var(--p-text);
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    #panel-daily-orders-plan .btn {
      cursor: pointer;
    }

    #panel-daily-orders-plan .btn:hover {
      background: var(--p-soft);
    }

    #panel-daily-orders-plan .btn.primary {
      background: var(--p-violet);
      border-color: var(--p-violet);
      color: white;
    }

    #panel-daily-orders-plan .card {
      border: 1px solid var(--p-border);
      border-radius: 12px;
      background: var(--p-card);
      box-shadow: 0 1px 2px rgb(15 23 42 / 6%);
      overflow: hidden;
    }

    #panel-daily-orders-plan .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    #panel-daily-orders-plan .kpi {
      padding: 14px;
      display: grid;
      gap: 6px;
    }

    #panel-daily-orders-plan .kpi strong {
      font-size: 20px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    #panel-daily-orders-plan .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid var(--p-border);
      border-radius: 999px;
      background: var(--p-card);
      padding: 4px 9px;
      white-space: nowrap;
    }

    #panel-daily-orders-plan .pill.input {
      border-color: color-mix(in srgb, var(--p-amber) 45%, var(--p-border));
      background: var(--p-amber-soft);
    }

    #panel-daily-orders-plan .pill.auto {
      border-color: color-mix(in srgb, var(--p-blue) 40%, var(--p-border));
      background: var(--p-blue-soft);
    }

    #panel-daily-orders-plan .pill.risk {
      border-color: color-mix(in srgb, var(--p-red) 40%, var(--p-border));
      background: var(--p-red-soft);
      color: var(--p-red);
    }

    #panel-daily-orders-plan .pill.good {
      border-color: color-mix(in srgb, var(--p-green) 40%, var(--p-border));
      background: var(--p-green-soft);
      color: var(--p-green);
    }

    #panel-daily-orders-plan .toolbar {
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--p-border);
    }

    #panel-daily-orders-plan .month-jump {
      padding: 10px 12px;
      border-bottom: 1px solid var(--p-border);
      background: var(--p-soft);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    #panel-daily-orders-plan .work {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    #panel-daily-orders-plan .table-card {
      min-width: 0;
    }

    #panel-daily-orders-plan .table-head {
      padding: 13px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--p-border);
    }

    #panel-daily-orders-plan .table-wrap {
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    #panel-daily-orders-plan table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;

    #panel-daily-orders-plan th,

      text-align: right;
      min-width: 42px;
      vertical-align: middle;

      color: var(--p-muted);

    }

    #panel-daily-orders-plan .drawer {

      gap: 0;
    }

    #panel-daily-orders-plan .drawer-block {
      padding: 13px;
      border-bottom: 1px solid var(--p-border);
      display: grid;
      gap: 10px;
    }

    #panel-daily-orders-plan .drawer-block:last-child {
      border-bottom: 0;
    }

    #panel-daily-orders-plan .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #panel-daily-orders-plan .detail {
      border: 1px solid var(--p-border);
      border-radius: 10px;
      background: var(--p-soft);
      padding: 9px;
      display: grid;
      gap: 3px;
    }

    #panel-daily-orders-plan .detail strong {
      font-weight: 500;
    }

    #panel-daily-orders-plan .editor-grid {
      display: grid;
      gap: 8px;
    }

    #panel-daily-orders-plan .input {
      width: 100%;
      justify-content: flex-start;
      background: var(--p-card);
    }

    #panel-daily-orders-plan .scroll-hint {
      padding: 9px 12px;
      display: none;
      border: 1px solid color-mix(in srgb, var(--p-blue) 34%, var(--p-border));

      background: var(--p-blue-soft);
    }

    @media (max-width: 1100px) {
      #panel-daily-orders-plan .shell {
        grid-template-columns: 1fr;
      }

      #panel-daily-orders-plan .sidebar {
        display: none;
      }

      #panel-daily-orders-plan .mobile-brand {
        display: flex;
      }

      #panel-daily-orders-plan .main {
        padding: 14px;
      }

      #panel-daily-orders-plan .work {
        grid-template-columns: 1fr;
      }

      #panel-daily-orders-plan .scroll-hint {
        display: block;
      }
    }

    @media (max-width: 760px) {
      #panel-daily-orders-plan .kpis {
        grid-template-columns: 1fr;
      }

      #panel-daily-orders-plan .actions,
      #panel-daily-orders-plan .toolbar &gt; .row {
        width: 100%;
      }

      #panel-daily-orders-plan .btn,
      #panel-daily-orders-plan .select {
        flex: 1 1 auto;

      #panel-daily-orders-plan th,
      #panel-daily-orders-plan td {
        min-width: 38px;
      }

      #panel-daily-orders-plan .sticky-1,
      #panel-daily-orders-plan .sticky-3,
      #panel-daily-orders-plan .sticky-4,
      #panel-daily-orders-plan .sticky-5 {
        display: none;
      }

      #panel-daily-orders-plan .sticky-2 {
        left: 0;
        min-width: 112px;
      }

      function ramp(total, days, start, peak, decay) {
        const values = [];
        let sum = 0;
        for (let i = 0; i &lt; days; i += 1) {
          const position = i / Math.max(days - 1, 1);
          const raw = position &lt; 0.55
            ? start + (peak - start) * (position / 0.55)
            : peak - (peak - decay) * ((position - 0.55) / 0.45);
          const value = Math.max(0, Math.round(raw));
          values.push(value);
          sum += value;
        }
        const diff = total - sum;
        values[values.length - 1] = Math.max(0, values[values.length - 1] + diff);
        return values;
      }
