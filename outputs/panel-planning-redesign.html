.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;panel-planning-redesign&quot;&gt;
  &lt;style&gt;
    #panel-planning-redesign {
      --fp-bg: light-dark(rgb(245 245 245), rgb(24 24 27));
      --fp-card: light-dark(rgb(255 255 255), rgb(31 31 44));
      --fp-soft: light-dark(rgb(248 250 252), rgb(39 39 52));
      --fp-border: light-dark(rgb(226 232 240), rgb(63 63 70));
      --fp-border-soft: light-dark(rgb(241 245 249), rgb(47 47 59));
      --fp-text: light-dark(rgb(15 23 42), rgb(241 245 249));
      --fp-muted: light-dark(rgb(100 116 139), rgb(161 161 170));
      --fp-violet: light-dark(rgb(124 58 237), rgb(167 139 250));
      --fp-violet-soft: light-dark(rgb(245 243 255), rgb(46 34 78));
      --fp-green: light-dark(rgb(5 150 105), rgb(52 211 153));
      --fp-green-soft: light-dark(rgb(236 253 245), rgb(20 83 45));
      --fp-red: light-dark(rgb(220 38 38), rgb(248 113 113));
      --fp-red-soft: light-dark(rgb(254 242 242), rgb(69 26 26));
      --fp-amber: light-dark(rgb(217 119 6), rgb(251 191 36));
      --fp-amber-soft: light-dark(rgb(255 251 235), rgb(69 45 16));
      --fp-blue: light-dark(rgb(37 99 235), rgb(96 165 250));
      --fp-blue-soft: light-dark(rgb(239 246 255), rgb(30 58 138));
      --fp-sidebar: rgb(26 26 46);
      --fp-sidebar-soft: rgb(255 255 255 / 10%);
      color: var(--fp-text);
      font-size: var(--font-size-base);
    }

    #panel-planning-redesign * {
      box-sizing: border-box;
    }

    #panel-planning-redesign button,
    #panel-planning-redesign select,
    #panel-planning-redesign input {
      font: inherit;
    }

    #panel-planning-redesign .fp-shell {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      min-height: 980px;
      background: var(--fp-bg);
      border: 1px solid var(--fp-border);
      overflow: hidden;
    }

    #panel-planning-redesign .fp-sidebar {
      background: var(--fp-sidebar);
      color: rgb(226 232 240);
      display: flex;
      flex-direction: column;
      min-height: 980px;
    }

    #panel-planning-redesign .fp-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 16px;
      border-bottom: 1px solid rgb(255 255 255 / 10%);
    }

    #panel-planning-redesign .fp-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: rgb(196 181 253);
      background: rgb(124 58 237 / 24%);
    }

    #panel-planning-redesign .fp-brand strong {
      display: block;
      color: white;
      font-weight: 500;
    }

    #panel-planning-redesign .fp-brand span,
    #panel-planning-redesign .fp-nav-group {
      color: rgb(148 163 184);
    }

    #panel-planning-redesign .fp-nav {
      padding: 14px 12px;
      display: grid;
      gap: 10px;
    }

    #panel-planning-redesign .fp-nav-group {
      margin: 8px 0 2px;
      padding: 0 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 11px;
      font-weight: 500;
    }

    #panel-planning-redesign .fp-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 10px;
      color: rgb(203 213 225);
      text-decoration: none;
    }

    #panel-planning-redesign .fp-nav-link.is-active {
      color: rgb(196 181 253);
      background: rgb(124 58 237 / 20%);
    }

    #panel-planning-redesign .fp-user {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid rgb(255 255 255 / 10%);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #panel-planning-redesign .fp-avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgb(124 58 237 / 30%);
      color: rgb(221 214 254);
      font-size: 12px;
      font-weight: 500;
    }

    #panel-planning-redesign .fp-main {
      min-width: 0;
      padding: 24px 32px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    #panel-planning-redesign .fp-mobile-brand {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--fp-card);
      border: 1px solid var(--fp-border);
    }

    #panel-planning-redesign .fp-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    #panel-planning-redesign .fp-kicker,
    #panel-planning-redesign .fp-muted {
      color: var(--fp-muted);
    }

    #panel-planning-redesign h2,
    #panel-planning-redesign h3 {
      margin: 0;
      font-weight: 500;
    }

    #panel-planning-redesign .fp-title {
      display: grid;
      gap: 5px;
    }

    #panel-planning-redesign .fp-actions,
    #panel-planning-redesign .fp-row,
    #panel-planning-redesign .fp-tabs,
    #panel-planning-redesign .fp-filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    #panel-planning-redesign .fp-btn,
    #panel-planning-redesign .fp-select,
    #panel-planning-redesign .fp-field {
      min-height: 36px;
      border: 1px solid var(--fp-border);
      border-radius: 9px;
      background: var(--fp-card);
      color: var(--fp-text);
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    #panel-planning-redesign .fp-btn {
      cursor: pointer;
    }

    #panel-planning-redesign .fp-btn:hover,
    #panel-planning-redesign .fp-select:hover {
      background: var(--fp-soft);
    }

    #panel-planning-redesign .fp-btn-primary {
      background: var(--fp-violet);
      border-color: var(--fp-violet);
      color: white;
    }

    #panel-planning-redesign .fp-btn-primary:hover {
      background: color-mix(in srgb, var(--fp-violet) 88%, black);
    }

    #panel-planning-redesign .fp-btn-ghost {
      color: var(--fp-muted);
    }

    #panel-planning-redesign .fp-card {
      background: var(--fp-card);
      border: 1px solid var(--fp-border);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgb(15 23 42 / 6%);
      overflow: hidden;
    }

    #panel-planning-redesign .fp-card-pad {
      padding: 14px;
    }

    #panel-planning-redesign .fp-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    #panel-planning-redesign .fp-kpi {
      display: grid;
      gap: 6px;
      padding: 15px;
    }

    #panel-planning-redesign .fp-kpi strong {
      font-size: 20px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    #panel-planning-redesign .fp-delta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 12px;
      background: var(--fp-green-soft);
      color: var(--fp-green);
    }

    #panel-planning-redesign .fp-delta.warn {
      background: var(--fp-amber-soft);
      color: var(--fp-amber);
    }

    #panel-planning-redesign .fp-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px;
    }

    #panel-planning-redesign .fp-tab {
      border: 1px solid var(--fp-border);
      border-radius: 8px;
      background: var(--fp-card);
      color: var(--fp-muted);
      min-height: 36px;
      padding: 8px 11px;
      cursor: pointer;
    }

    #panel-planning-redesign .fp-tab.is-active {
      background: var(--fp-violet);
      border-color: var(--fp-violet);
      color: white;
    }

    #panel-planning-redesign .fp-source-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-top: 1px solid var(--fp-border-soft);
      padding: 10px 12px;
      background: var(--fp-soft);
    }

    #panel-planning-redesign .fp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 9px;
      border: 1px solid var(--fp-border);
      background: var(--fp-card);
      color: var(--fp-text);
      white-space: nowrap;
    }

    #panel-planning-redesign .fp-pill.auto {
      border-color: color-mix(in srgb, var(--fp-blue) 38%, var(--fp-border));
      background: var(--fp-blue-soft);
    }

    #panel-planning-redesign .fp-pill.input {
      border-color: color-mix(in srgb, var(--fp-amber) 40%, var(--fp-border));
      background: var(--fp-amber-soft);
    }

    #panel-planning-redesign .fp-pill.risk {
      border-color: color-mix(in srgb, var(--fp-red) 36%, var(--fp-border));
      background: var(--fp-red-soft);
    }

    #panel-planning-redesign .fp-work {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    #panel-planning-redesign .fp-section {
      display: none;
    }

    #panel-planning-redesign .fp-section.is-active {
      display: block;
    }

    #panel-planning-redesign .fp-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px 14px;
      border-bottom: 1px solid var(--fp-border);
      background: var(--fp-card);
    }

    #panel-planning-redesign .fp-table-wrap {
      max-width: 100%;
      overflow-x: auto;
    }

    #panel-planning-redesign table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 1180px;
      font-size: 12px;
    }

    #panel-planning-redesign th,
    #panel-planning-redesign td {
      border-right: 1px solid var(--fp-border-soft);
      border-bottom: 1px solid var(--fp-border-soft);
      padding: 8px 9px;
      white-space: nowrap;
      background: var(--fp-card);
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }

    #panel-planning-redesign th {
      position: sticky;
      top: 0;
      z-index: 3;
      text-align: right;
      color: var(--fp-muted);
      background: var(--fp-soft);
      font-weight: 500;
    }

    #panel-planning-redesign .fp-left,
    #panel-planning-redesign th.fp-left {
      text-align: left;
    }

    #panel-planning-redesign .fp-num {
      text-align: right;
    }

    #panel-planning-redesign .fp-sticky-1,
    #panel-planning-redesign .fp-sticky-2,
    #panel-planning-redesign .fp-sticky-3 {
      position: sticky;
      z-index: 4;
      text-align: left;
    }

    #panel-planning-redesign .fp-sticky-1 {
      left: 0;
      min-width: 122px;
    }

    #panel-planning-redesign .fp-sticky-2 {
      left: 122px;
      min-width: 108px;
    }

    #panel-planning-redesign .fp-sticky-3 {
      left: 230px;
      min-width: 128px;
    }

    #panel-planning-redesign th.fp-sticky-1,
    #panel-planning-redesign th.fp-sticky-2,
    #panel-planning-redesign th.fp-sticky-3 {
      z-index: 6;
      background: var(--fp-soft);
    }

    #panel-planning-redesign td.fp-sticky-1,
    #panel-planning-redesign td.fp-sticky-2,
    #panel-planning-redesign td.fp-sticky-3 {
      background: var(--fp-card);
    }

    #panel-planning-redesign .fp-month {
      text-align: center;
      background: var(--fp-blue-soft);
      color: var(--fp-text);
    }

    #panel-planning-redesign .fp-row-group td {
      background: var(--fp-soft);
      color: var(--fp-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-size: 11px;
      font-weight: 500;
    }

    #panel-planning-redesign .fp-row-total td {
      background: var(--fp-violet-soft);
      font-weight: 500;
    }

    #panel-planning-redesign .fp-row-selected td {
      background: color-mix(in srgb, var(--fp-violet) 8%, var(--fp-card));
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fp-violet) 28%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--fp-violet) 28%, transparent);
    }

    #panel-planning-redesign tbody tr:not(.fp-row-group):hover td {
      background: color-mix(in srgb, var(--fp-violet) 5%, var(--fp-card));
    }

    #panel-planning-redesign .fp-sku-button {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      display: grid;
      gap: 2px;
      text-align: left;
      cursor: pointer;
    }

    #panel-planning-redesign .fp-sku-button strong {
      font-weight: 500;
      color: var(--fp-text);
    }

    #panel-planning-redesign .fp-input-cell {
      background: var(--fp-amber-soft);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fp-amber) 48%, transparent);
    }

    #panel-planning-redesign .fp-auto-cell {
      background: var(--fp-blue-soft);
    }

    #panel-planning-redesign .fp-risk-cell {
      background: var(--fp-red-soft);
      color: var(--fp-red);
    }

    #panel-planning-redesign .fp-mini {
      color: var(--fp-muted);
      font-size: 11px;
    }

    #panel-planning-redesign .fp-drawer {
      display: grid;
      gap: 12px;
    }

    #panel-planning-redesign .fp-drawer-block {
      padding: 13px;
      border-bottom: 1px solid var(--fp-border);
      display: grid;
      gap: 10px;
    }

    #panel-planning-redesign .fp-drawer-block:last-child {
      border-bottom: 0;
    }

    #panel-planning-redesign .fp-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #panel-planning-redesign .fp-detail-card {
      border: 1px solid var(--fp-border);
      border-radius: 10px;
      padding: 9px;
      background: var(--fp-soft);
      display: grid;
      gap: 3px;
    }

    #panel-planning-redesign .fp-detail-card strong {
      font-weight: 500;
    }

    #panel-planning-redesign .fp-day-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    #panel-planning-redesign .fp-day {
      min-height: 44px;
      border: 1px solid var(--fp-border);
      border-radius: 8px;
      background: var(--fp-card);
      display: grid;
      place-items: center;
      gap: 1px;
      padding: 4px 2px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    #panel-planning-redesign .fp-day.is-plan {
      background: var(--fp-amber-soft);
      border-color: color-mix(in srgb, var(--fp-amber) 44%, var(--fp-border));
    }

    #panel-planning-redesign .fp-day.is-risk {
      background: var(--fp-red-soft);
      border-color: color-mix(in srgb, var(--fp-red) 40%, var(--fp-border));
      color: var(--fp-red);
    }

    #panel-planning-redesign .fp-month-cards,
    #panel-planning-redesign .fp-purchase-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }

    #panel-planning-redesign .fp-purchase-card {
      border: 1px solid var(--fp-border);
      border-radius: 12px;
      background: var(--fp-card);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    #panel-planning-redesign .fp-progress {
      height: 8px;
      border-radius: 999px;
      background: var(--fp-soft);
      overflow: hidden;
    }

    #panel-planning-redesign .fp-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--fp-violet);
    }

    #panel-planning-redesign .fp-sizes {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    #panel-planning-redesign .fp-size {
      border: 1px solid var(--fp-border);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      background: var(--fp-soft);
      font-size: 11px;
    }

    #panel-planning-redesign .fp-approval {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
    }

    #panel-planning-redesign .fp-checklist {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #panel-planning-redesign .fp-checklist li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--fp-border);
      border-radius: 10px;
      background: var(--fp-card);
    }

    @media (max-width: 1100px) {
      #panel-planning-redesign .fp-shell {
        grid-template-columns: 1fr;
      }

      #panel-planning-redesign .fp-sidebar {
        display: none;
      }

      #panel-planning-redesign .fp-mobile-brand {
        display: flex;
      }

      #panel-planning-redesign .fp-main {
        padding: 14px;
      }

      #panel-planning-redesign .fp-work {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      #panel-planning-redesign .fp-kpis,
      #panel-planning-redesign .fp-month-cards,
      #panel-planning-redesign .fp-purchase-grid,
      #panel-planning-redesign .fp-approval {
        grid-template-columns: 1fr;
      }

      #panel-planning-redesign .fp-head,
      #panel-planning-redesign .fp-toolbar {
        align-items: stretch;
      }

      #panel-planning-redesign .fp-actions,
      #panel-planning-redesign .fp-filters,
      #panel-planning-redesign .fp-tabs {
        width: 100%;
      }

      #panel-planning-redesign .fp-btn,
      #panel-planning-redesign .fp-tab,
      #panel-planning-redesign .fp-select {
        flex: 1 1 auto;
      }

      #panel-planning-redesign table {
        min-width: 980px;
      }
    }
  &lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
