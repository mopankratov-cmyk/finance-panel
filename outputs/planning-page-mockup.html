.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;planning-page-mockup&quot; class=&quot;ppm&quot;&gt;
  &lt;style&gt;
    #planning-page-mockup {
      --ppm-page-bg: light-dark(rgb(245 245 245), rgb(24 24 27));
      --ppm-card: light-dark(rgb(255 255 255), rgb(30 30 46));
      --ppm-card-soft: light-dark(rgb(248 250 252), rgb(39 39 52));
      --ppm-table-head: light-dark(rgb(248 250 252), rgb(39 39 52));
      --ppm-table-group: light-dark(rgb(239 246 255), rgb(30 41 59));
      --ppm-border: light-dark(rgb(226 232 240), rgb(63 63 70));
      --ppm-text: light-dark(rgb(15 23 42), rgb(241 245 249));
      --ppm-muted-text: light-dark(rgb(100 116 139), rgb(161 161 170));
      --ppm-primary: light-dark(rgb(124 58 237), rgb(167 139 250));
      --ppm-primary-foreground: light-dark(rgb(255 255 255), rgb(24 24 27));
      --ppm-input-bg: light-dark(rgb(255 247 237), rgb(67 45 32));
      --ppm-input-border: light-dark(rgb(251 146 60), rgb(251 146 60));
      --ppm-auto-bg: light-dark(rgb(239 246 255), rgb(30 41 59));
      --ppm-auto-border: light-dark(rgb(147 197 253), rgb(96 165 250));
      --ppm-risk-bg: light-dark(rgb(254 242 242), rgb(69 26 26));
      --ppm-risk-border: light-dark(rgb(252 165 165), rgb(248 113 113));
      --ppm-success: light-dark(rgb(5 150 105), rgb(52 211 153));
      color: var(--ppm-text);
      font-size: var(--font-size-base);
    }

    #planning-page-mockup * {
      box-sizing: border-box;
    }

    #planning-page-mockup .ppm-page {
      display: grid;
      gap: 16px;
      min-width: 0;
      background: var(--ppm-page-bg);
      padding: 14px;
    }

    #planning-page-mockup .ppm-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #planning-page-mockup .ppm-title {
      display: grid;
      gap: 4px;
      min-width: 260px;
    }

    #planning-page-mockup .ppm-title h2 {
      margin: 0;
      font-weight: 500;
    }

    #planning-page-mockup .ppm-muted {
      color: var(--ppm-muted-text);
    }

    #planning-page-mockup .ppm-actions,
    #planning-page-mockup .ppm-tabs,
    #planning-page-mockup .ppm-filterbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    #planning-page-mockup .ppm-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border: 1px solid var(--ppm-border);
      border-radius: 8px;
      background: var(--ppm-card);
      color: var(--ppm-text);
      padding: 6px 8px;
      white-space: nowrap;
    }

    #planning-page-mockup .ppm-chip.is-draft {
      border-color: color-mix(in srgb, var(--ppm-primary) 46%, var(--ppm-border));
      background: color-mix(in srgb, var(--ppm-primary) 11%, var(--ppm-card));
    }

    #planning-page-mockup .ppm-chip.is-input {
      border-color: var(--ppm-input-border);
      background: var(--ppm-input-bg);
    }

    #planning-page-mockup .ppm-chip.is-auto {
      border-color: var(--ppm-auto-border);
      background: var(--ppm-auto-bg);
    }

    #planning-page-mockup .ppm-chip.is-risk {
      border-color: var(--ppm-risk-border);
      background: var(--ppm-risk-bg);
    }

    #planning-page-mockup .ppm-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 14px;
      align-items: start;
    }

    #planning-page-mockup .ppm-panel {
      border: 1px solid var(--ppm-border);
      border-radius: 12px;
      background: var(--ppm-card);
      box-shadow: 0 1px 2px color-mix(in srgb, var(--ppm-text) 8%, transparent);
      overflow: hidden;
      min-width: 0;
    }

    #planning-page-mockup .ppm-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--ppm-border);
      background: var(--ppm-card-soft);
    }

    #planning-page-mockup .ppm-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    #planning-page-mockup .ppm-kpi {
      padding: 12px;
      display: grid;
      gap: 4px;
    }

    #planning-page-mockup .ppm-kpi strong {
      font-weight: 500;
    }

    #planning-page-mockup .ppm-tab {
      color: var(--ppm-muted-text);
    }

    #planning-page-mockup .ppm-tab.is-selected {
      background: var(--ppm-primary);
      color: var(--ppm-primary-foreground);
      border-color: var(--ppm-primary);
    }

    #planning-page-mockup .ppm-select,
    #planning-page-mockup .ppm-input,
    #planning-page-mockup textarea {
      min-height: 34px;
      border: 1px solid var(--ppm-border);
      border-radius: 8px;
      background: var(--ppm-card);
      color: var(--ppm-text);
      padding: 7px 9px;
      font: inherit;
    }

    #planning-page-mockup .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      border: 1px solid var(--ppm-border);
      border-radius: 8px;
      background: var(--ppm-card);
      color: var(--ppm-text);
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    #planning-page-mockup .btn:hover {
      background: var(--ppm-card-soft);
      border-color: color-mix(in srgb, var(--ppm-primary) 28%, var(--ppm-border));
    }

    #planning-page-mockup .btn-primary {
      background: var(--ppm-primary);
      color: var(--ppm-primary-foreground);
      border-color: var(--ppm-primary);
    }

    #planning-page-mockup .btn-primary:hover {
      background: color-mix(in srgb, var(--ppm-primary) 90%, var(--ppm-text));
      border-color: color-mix(in srgb, var(--ppm-primary) 90%, var(--ppm-text));
    }

    #planning-page-mockup textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
    }

    #planning-page-mockup .ppm-table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    #planning-page-mockup table {
      width: max-content;
      min-width: 1180px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }

    #planning-page-mockup th,
    #planning-page-mockup td {
      border-right: 1px solid var(--ppm-border);
      border-bottom: 1px solid var(--ppm-border);
      padding: 6px 7px;
      white-space: nowrap;
      vertical-align: middle;
      background: var(--ppm-card);
    }

    #planning-page-mockup th {
      position: sticky;
      top: 0;
      z-index: 3;
      font-weight: 500;
      color: var(--ppm-muted-text);
      background: var(--ppm-table-head);
      text-align: right;
    }

    #planning-page-mockup th:first-child,
    #planning-page-mockup td:first-child {
      border-left: 1px solid var(--ppm-border);
    }

    #planning-page-mockup thead tr:first-child th {
      border-top: 1px solid var(--ppm-border);
    }

    #planning-page-mockup .ppm-sticky-1,
    #planning-page-mockup .ppm-sticky-2,
    #planning-page-mockup .ppm-sticky-3 {
      position: sticky;
      z-index: 4;
      text-align: left;
    }

    #planning-page-mockup .ppm-sticky-1 {
      left: 0;
      min-width: 108px;
    }

    #planning-page-mockup .ppm-sticky-2 {
      left: 108px;
      min-width: 112px;
    }

    #planning-page-mockup .ppm-sticky-3 {
      left: 220px;
      min-width: 138px;
    }

    #planning-page-mockup th.ppm-sticky-1,
    #planning-page-mockup th.ppm-sticky-2,
    #planning-page-mockup th.ppm-sticky-3 {
      z-index: 6;
      background: var(--ppm-table-head);
    }

    #planning-page-mockup td.ppm-sticky-1,
    #planning-page-mockup td.ppm-sticky-2,
    #planning-page-mockup td.ppm-sticky-3 {
      background: var(--ppm-card);
    }

    #planning-page-mockup .ppm-group {
      text-align: center;
      color: var(--ppm-text);
      background: var(--ppm-table-group);
    }

    #planning-page-mockup .ppm-article {
      display: grid;
      gap: 2px;
    }

    #planning-page-mockup .ppm-article strong {
      font-weight: 500;
    }

    #planning-page-mockup .ppm-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #planning-page-mockup .ppm-cell-input {
      background: var(--ppm-input-bg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ppm-input-border) 72%, transparent);
      color: var(--ppm-text);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #planning-page-mockup .ppm-cell-auto {
      background: var(--ppm-auto-bg);
      color: var(--ppm-text);
    }

    #planning-page-mockup .ppm-cell-risk {
      background: var(--ppm-risk-bg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ppm-risk-border) 70%, transparent);
      color: var(--ppm-text);
    }

    #planning-page-mockup .ppm-row-total td {
      background: var(--ppm-card-soft);
      font-weight: 500;
    }

    #planning-page-mockup .ppm-row-selected td {
      background: color-mix(in srgb, var(--ppm-primary) 7%, var(--ppm-card));
    }

    #planning-page-mockup .ppm-row-selected td.ppm-sticky-1,
    #planning-page-mockup .ppm-row-selected td.ppm-sticky-2,
    #planning-page-mockup .ppm-row-selected td.ppm-sticky-3 {
      background: color-mix(in srgb, var(--ppm-primary) 9%, var(--ppm-card));
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ppm-primary) 24%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ppm-primary) 24%, transparent);
    }

    #planning-page-mockup tbody tr:hover td {
      background: color-mix(in srgb, var(--ppm-primary) 5%, var(--ppm-card));
    }

    #planning-page-mockup .ppm-drawer {
      display: grid;
      gap: 10px;
    }

    #planning-page-mockup .ppm-drawer-section {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--ppm-border);
    }

    #planning-page-mockup .ppm-field {
      display: grid;
      gap: 5px;
    }

    #planning-page-mockup .ppm-field label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--ppm-muted-text);
    }

    #planning-page-mockup .ppm-small-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #planning-page-mockup .ppm-heat {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
    }

    #planning-page-mockup .ppm-heat span {
      display: grid;
      gap: 2px;
      padding: 6px 3px;
      text-align: center;
      border: 1px solid var(--ppm-auto-border);
      border-radius: 6px;
      background: var(--ppm-auto-bg);
      font-variant-numeric: tabular-nums;
    }

    #planning-page-mockup .ppm-mobile-note {
      display: none;
      padding: 10px;
      border: 1px solid var(--ppm-auto-border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--ppm-auto-bg) 80%, var(--ppm-card));
      color: var(--ppm-text);
    }

    @media (max-width: 720px) {
      #planning-page-mockup .ppm-page {
        padding: 10px;
      }

      #planning-page-mockup .ppm-main,
      #planning-page-mockup .ppm-kpis {
        grid-template-columns: 1fr;
      }

      #planning-page-mockup .ppm-actions {
        width: 100%;
      }

      #planning-page-mockup .ppm-actions .btn,
      #planning-page-mockup .ppm-actions .ppm-chip {
        flex: 1 1 auto;
        justify-content: center;
      }

      #planning-page-mockup .ppm-mobile-note {
        display: block;
      }

      #planning-page-mockup table {
        min-width: 980px;
      }

      #planning-page-mockup .ppm-sticky-1 {
        min-width: 98px;
      }

      #planning-page-mockup .ppm-sticky-2 {
        left: 98px;
        min-width: 106px;
      }

      #planning-page-mockup .ppm-sticky-3 {
        left: 204px;
        min-width: 128px;
      }
    }
  &lt;/style&gt;
