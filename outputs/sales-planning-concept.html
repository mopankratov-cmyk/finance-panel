  height: 20px;
  border: 0;

}

  height: 20px;

.form-range:disabled {

.btn:focus-visible {

svg {

&lt;body&gt;

      gap: 4px;
      min-width: 220px;
    }

    #sales-planning-concept .spc-title h2 {

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;

      flex-wrap: wrap;
      gap: 8px;

      gap: 18px;

      gap: 10px;
      min-width: 0;

    #sales-planning-concept .spc-month {

      gap: 10px;

    #sales-planning-concept .spc-seg.is-demi {

    }

    #sales-planning-concept .spc-seg.is-winter {

    }

    #sales-planning-concept .spc-legend {
      display: grid;
      gap: 8px;
    }

    #sales-planning-concept .spc-legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      height: 10px;

      background: color-mix(in srgb, var(--viz-series-1) 72%, transparent);
    }

    #sales-planning-concept .spc-dot.is-demi {
      background: color-mix(in srgb, var(--viz-series-2) 72%, transparent);
    }

    #sales-planning-concept .spc-dot.is-winter {

    #sales-planning-concept .spc-panel.is-active {

      gap: 16px;

    #sales-planning-concept .spc-map {

      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;

  &lt;script&gt;
    (function () {
      const root = document.getElementById(&quot;sales-planning-concept&quot;);
      const scenarioEl = root.querySelector(&quot;#spc-scenario&quot;);
      const categoryEl = root.querySelector(&quot;#spc-category&quot;);
      const chartEl = root.querySelector(&quot;#spc-chart&quot;);
      const revenueEl = root.querySelector(&quot;#spc-revenue&quot;);
      const buyoutsEl = root.querySelector(&quot;#spc-buyouts&quot;);
      const reorderEl = root.querySelector(&quot;#spc-reorder&quot;);
      const revenueNoteEl = root.querySelector(&quot;#spc-revenue-note&quot;);
      const windTotalEl = root.querySelector(&quot;#spc-wind-total&quot;);
      const demiTotalEl = root.querySelector(&quot;#spc-demi-total&quot;);
      const winterTotalEl = root.querySelector(&quot;#spc-winter-total&quot;);
      const months = [&quot;Июл&quot;, &quot;Авг&quot;, &quot;Сен&quot;, &quot;Окт&quot;, &quot;Ноя&quot;, &quot;Дек&quot;];
      const scenarios = {
        conservative: { label: &quot;осторожно&quot;, multiplier: 0.85 },
        base: { label: &quot;база&quot;, multiplier: 1 },
        aggressive: { label: &quot;агрессивно&quot;, multiplier: 1.15 }
      };
      const categories = {
        wind: { label: &quot;Ветровки&quot;, cls: &quot;is-wind&quot;, revenue: 50.784, reorder: 2000, buyouts: [1103, 4872, 2489, 0, 0, 0] },
        demi: { label: &quot;Демисезон&quot;, cls: &quot;is-demi&quot;, revenue: 299.862, reorder: 14406, buyouts: [639, 1214, 3878, 7270, 5817, 3394] },
        winter: { label: &quot;Зима&quot;, cls: &quot;is-winter&quot;, revenue: 254.116, reorder: 21700, buyouts: [0, 0, 726, 3714, 6422, 4086] }
      };

      function fmt(n) {
        return Math.round(n).toLocaleString(&quot;ru-RU&quot;);
      }

      function activeKeys() {
        const selected = categoryEl.value;
        return selected === &quot;all&quot; ? [&quot;wind&quot;, &quot;demi&quot;, &quot;winter&quot;] : [selected];
      }

      function sum(values) {
        return values.reduce((a, b) =&gt; a + b, 0);
      }

      function render() {
        const scenario = scenarios[scenarioEl.value];
        const keys = activeKeys();
        const totalsByMonth = months.map((_, i) =&gt; keys.reduce((acc, key) =&gt; acc + categories[key].buyouts[i] * scenario.multiplier, 0));
        const max = Math.max(1, ...totalsByMonth);
        const revenue = keys.reduce((acc, key) =&gt; acc + categories[key].revenue, 0) * scenario.multiplier;
        const buyouts = keys.reduce((acc, key) =&gt; acc + sum(categories[key].buyouts), 0) * scenario.multiplier;
        const reorder = keys.reduce((acc, key) =&gt; acc + categories[key].reorder, 0);

        revenueEl.textContent = `${revenue.toLocaleString(&quot;ru-RU&quot;, { maximumFractionDigits: 1 })} млн ₽`;
        buyoutsEl.textContent = `${fmt(buyouts)} шт`;
        reorderEl.textContent = `${fmt(reorder)} шт`;
        revenueNoteEl.textContent = `${scenario.label}; категория: ${categoryEl.options[categoryEl.selectedIndex].text}`;
        windTotalEl.textContent = fmt(sum(categories.wind.buyouts) * scenario.multiplier);
        demiTotalEl.textContent = fmt(sum(categories.demi.buyouts) * scenario.multiplier);
        winterTotalEl.textContent = fmt(sum(categories.winter.buyouts) * scenario.multiplier);

        chartEl.innerHTML = &quot;&quot;;
        months.forEach((month, i) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;spc-month&quot;;
          const label = document.createElement(&quot;span&quot;);
          label.textContent = month;
          const bar = document.createElement(&quot;div&quot;);
          bar.className = &quot;spc-bar&quot;;
          bar.setAttribute(&quot;aria-label&quot;, `${month}: ${fmt(totalsByMonth[i])} выкупов`);

          keys.forEach((key) =&gt; {
            const value = categories[key].buyouts[i] * scenario.multiplier;
            const seg = document.createElement(&quot;span&quot;);
            seg.className = `spc-seg ${categories[key].cls}`;
            seg.style.width = `${max &gt; 0 ? (value / max) * 100 : 0}%`;
            seg.title = `${categories[key].label}: ${fmt(value)} шт`;
            bar.appendChild(seg);
          });

          const value = document.createElement(&quot;strong&quot;);
          value.textContent = fmt(totalsByMonth[i]);
          row.append(label, bar, value);
          chartEl.appendChild(row);
        });
      }

      root.querySelectorAll(&quot;[data-tab]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const tab = button.getAttribute(&quot;data-tab&quot;);
          root.querySelectorAll(&quot;[data-tab]&quot;).forEach((item) =&gt; {
            const selected = item === button;
            item.classList.toggle(&quot;is-selected&quot;, selected);
            item.setAttribute(&quot;aria-selected&quot;, selected ? &quot;true&quot; : &quot;false&quot;);
          });
          root.querySelectorAll(&quot;.spc-panel&quot;).forEach((panel) =&gt; {
            panel.classList.toggle(&quot;is-active&quot;, panel.id === `spc-tab-${tab}`);
          });
        });
      });

      scenarioEl.addEventListener(&quot;change&quot;, render);
      categoryEl.addEventListener(&quot;change&quot;, render);
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
