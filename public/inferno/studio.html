<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODA/studio — нод-студия виральных видео</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0c0d10; --bg-panel:#101216; --bg-card:#15171c; --bg-node:#181b21; --bg-input:#1f232b; --bg-hover:#2b313b;
  --bd:#21262e; --bd2:#2b313b; --bd3:#333a45; --bd-acc:#2b2a45; --bd-err:#3a2420;
  --tx-hi:#e8eaee; --tx-bd:#c2c7cf; --tx-mid:#98a0ab; --tx-lo:#5c636e; --tx-lo2:#4f5662;
  --acc:#7c74ff; --acc-lt:#9a93ff; --acc-soft:rgba(124,116,255,.12);
  --ok:#46c08f; --ok-bg:#13261d; --warn:#d6a94e; --warn-bg:#241f12; --err:#e5604f; --err-bg:#211a1a;
  --p-video:#5b9cf2; --p-audio:#46c08f; --p-image:#d6a94e; --p-script:#b078ef; --p-caption:#ef6fa6; --p-product:#3fb9c2;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg-deep);font-family:var(--sans);color:var(--tx-hi);-webkit-font-smoothing:antialiased;overflow:hidden;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2b313b;border-radius:6px;border:2px solid #0c0d10;}
::-webkit-scrollbar-thumb:hover{background:#3a414d;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes shimmer{0%{background-position:-480px 0;}100%{background-position:480px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes dash{to{stroke-dashoffset:-16;}}
.mono{font-family:var(--mono);}
.app{display:flex;height:100vh;width:100%;}
/* ---- RAIL ---- */
.rail{width:236px;flex:none;background:var(--bg-panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;}
.rail-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#7c74ff,#5a52d8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;}
.nav{flex:1;overflow-y:auto;padding:10px 10px;display:flex;flex-direction:column;gap:3px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.12s;}
.nav-item:hover{background:#15171c;}
.nav-item.active{background:var(--acc-soft);border-color:var(--bd-acc);}
.nav-chip{width:26px;height:26px;flex:none;border-radius:7px;background:#1f232b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--tx-mid);}
.nav-item.active .nav-chip{background:var(--acc);color:#fff;}
.nav-tt{font-size:12.5px;font-weight:600;line-height:1.15;}
.nav-st{font-size:9.5px;color:var(--tx-lo);font-family:var(--mono);margin-top:1px;}
.rail-foot{flex:none;padding:12px 14px;border-top:1px solid var(--bd);}
.bar{height:5px;border-radius:4px;background:#1f232b;overflow:hidden;margin-top:5px;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7c74ff,#9a93ff);}
/* ---- MAIN ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-deep);}
.hdr{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--bd);}
.hdr h1{font-size:18px;font-weight:600;margin:0;}
.meta-chip{font-size:10px;font-family:var(--mono);color:var(--tx-mid);background:#15171c;border:1px solid var(--bd2);padding:3px 8px;border-radius:6px;}
.body{flex:1;min-height:0;display:flex;overflow:hidden;}
.scroll{flex:1;min-width:0;overflow-y:auto;padding:18px 20px;}
.aside{flex:none;border-left:1px solid var(--bd);background:var(--bg-panel);overflow-y:auto;}
/* ---- atoms ---- */
.btn{font-family:var(--sans);font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--bd2);background:#1f232b;color:var(--tx-bd);transition:.12s;}
.btn:hover{background:#252a33;}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn.primary:hover{background:#6b63ef;}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140d;}
.btn.sm{padding:5px 10px;font-size:11px;}
.input{background:var(--bg-input);border:1px solid var(--bd2);border-radius:7px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:7px 10px;outline:none;}
.input:focus{border-color:var(--acc);}
.sec-title{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx-lo2);font-weight:600;margin:0 0 9px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:6px;background:#15171c;border:1px solid var(--bd2);color:var(--tx-mid);}
.ph{background:repeating-linear-gradient(135deg,#23272f 0 8px,#1d2128 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--tx-lo2);font-size:9px;font-family:var(--mono);}
.skel{background:linear-gradient(90deg,#181b21 0px,#222730 240px,#181b21 480px);background-size:480px 100%;animation:shimmer 1.4s infinite linear;}
.spinner{width:22px;height:22px;border:2.5px solid #2b313b;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;}
.muted{color:var(--tx-lo);font-size:12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;color:var(--tx-lo);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#181b21;border:1px solid var(--bd-acc);color:var(--tx-hi);padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:99;opacity:0;transition:.2s;}
.toast.show{opacity:1;}
.row{display:flex;align-items:center;}
.grid{display:grid;gap:12px;}
.card{background:var(--bg-card);border:1px solid var(--bd);border-radius:11px;}
.badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.3px;}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--bg-deep);flex:none;}
.legend-sq{width:7px;height:7px;border-radius:2px;display:inline-block;}
</style>
</head>
<body>
<div class="app">
  <!-- ===== RAIL ===== -->
  <aside class="rail">
    <div class="rail-head">
      <div class="logo">N</div>
      <div style="display:flex;flex-direction:column;line-height:1.1;">
        <span style="font-size:13px;font-weight:600;letter-spacing:.2px;">NODA<span style="color:var(--acc);">/</span>studio</span>
        <span class="mono" style="font-size:10px;color:var(--tx-lo);margin-top:2px;">viral video graph</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="row" style="justify-content:space-between;font-size:11px;color:var(--tx-mid);">
        <span>Бюджет рендеров</span><span class="mono" id="budget-val">$182/250</span>
      </div>
      <div class="bar"><i id="budget-bar" style="width:73%"></i></div>
      <div class="row" style="gap:9px;margin-top:12px;">
        <div class="dot" style="width:28px;height:28px;background:linear-gradient(135deg,#7c74ff,#5a52d8);"></div>
        <div style="line-height:1.2;"><div style="font-size:12px;font-weight:600;">Алексей · селлер</div><div class="mono" style="font-size:9.5px;color:var(--tx-lo);">WB · 3 ниши</div></div>
      </div>
    </div>
  </aside>
  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="hdr" id="hdr"></header>
    <div class="body" id="screen"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
//==================== CORE ====================
const API = "/api/factory";
const S = {
  screen: "center",
  niches: [], generations: [], recipes: [],
  activeNiche: "cosmetics",
  brief: {}, briefLoading: {},
  feed: {}, // niche -> feed
  decompose: null, decomposeLoading: false, selectedVideo: null,
  recipe: null, // current open recipe {recipe, nodes}
  selectedNode: null,
  tool: "seedance", toolSchemas: {},
  run: null, runPoll: null,
  preview: {}, // nodeHash -> {status,url}
};
const SCREENS = [
  { id:"center",   chip:"01", tt:"Командный центр", st:"карта осознания" },
  { id:"compete",  chip:"02", tt:"Анализ конкурентов", st:"decompose" },
  { id:"canvas",   chip:"03", tt:"Нод-канвас", st:"граф видео" },
  { id:"inspector",chip:"04", tt:"Инспектор ноды", st:"настройки" },
  { id:"assembly", chip:"05", tt:"Сборка · ОТК", st:"таймлайн" },
  { id:"library",  chip:"06", tt:"База видосов", st:"рецепты" },
  { id:"ds",       chip:"DS", tt:"Дизайн-система", st:"токены" },
];
const NICHE_EMOJI = { cosmetics:"💄", clothing:"🧥", toys:"🔫", default:"📦" };

async function api(path, opts){
  try{
    const r = await fetch(API+path, opts);
    const j = await r.json().catch(()=>({error:"не JSON"}));
    return j;
  }catch(e){ return { error:String(e).slice(0,120) }; }
}
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="style")e.style.cssText=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  for(const k of kids){ if(k==null)continue; e.appendChild(typeof k==="string"?document.createTextNode(k):k); }
  return e;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }
function fmtViews(n){ n=Number(n)||0; return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(n); }

function renderNav(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  SCREENS.forEach(s=>{
    nav.appendChild(el("div",{class:"nav-item"+(S.screen===s.id?" active":""),onclick:()=>go(s.id)},
      el("div",{class:"nav-chip"},s.chip),
      el("div",{},el("div",{class:"nav-tt"},s.tt),el("div",{class:"nav-st"},s.st))
    ));
  });
}
function go(id){ S.screen=id; renderNav(); render(); }
function setHeader(title, chip, right){
  const h=document.getElementById("hdr"); h.innerHTML="";
  h.appendChild(el("h1",{},title));
  if(chip)h.appendChild(el("span",{class:"meta-chip"},chip));
  h.appendChild(el("div",{style:"flex:1"}));
  if(right)h.appendChild(right);
}

//==================== ROUTER ====================
async function render(){
  const root=document.getElementById("screen"); root.innerHTML="";
  if(S.screen==="center")return screenCenter(root);
  if(S.screen==="compete")return screenCompete(root);
  if(S.screen==="canvas")return screenCanvas(root);
  if(S.screen==="inspector")return screenInspector(root);
  if(S.screen==="assembly")return screenAssembly(root);
  if(S.screen==="library")return screenLibrary(root);
  if(S.screen==="ds")return screenDS(root);
}

//==================== 01 · COMMAND CENTER ====================
async function screenCenter(root){
  setHeader("Командный центр","карта осознания",
    el("button",{class:"btn primary",onclick:()=>toast("Новая ниша — заведи товары в кабинете")},"+ Новая ниша"));
  const left=el("div",{class:"scroll"});
  const aside=el("div",{class:"aside",style:"width:340px;padding:16px;"});
  root.appendChild(left); root.appendChild(aside);

  // legend
  left.appendChild(el("div",{class:"row",style:"gap:16px;margin-bottom:14px;font-size:10.5px;color:var(--tx-mid);"},
    legend("var(--ok)","есть плейбук"), legend("var(--acc)","виральные"), legend("var(--warn)","есть съёмка")));

  const tiles=el("div",{class:"grid",style:"grid-template-columns:repeat(3,1fr);"});
  left.appendChild(el("div",{class:"sec-title"},"Ниши"));
  left.appendChild(tiles);
  tiles.appendChild(loadingCard("ниши…"));

  const data=await api("/studio");
  S.niches=data.niches||[]; S.generations=data.generations||[]; S.recipes=data.recipes||[];
  tiles.innerHTML="";
  if(!S.niches.length){ tiles.appendChild(emptyBox("нет данных — синкни орбиты")); }
  S.niches.forEach(n=>tiles.appendChild(nicheTile(n)));

  const prodWrap=el("div",{style:"margin-top:22px;"});
  prodWrap.appendChild(el("div",{class:"sec-title"},"Товары активной ниши"));
  const plist=el("div",{style:"display:flex;flex-direction:column;gap:9px;"});
  prodWrap.appendChild(plist); left.appendChild(prodWrap);
  plist.appendChild(loadingCard("товары…"));
  loadProducts(plist);

  renderMarketer(aside);
}
function legend(c,t){ return el("span",{class:"row",style:"gap:5px;"},el("span",{class:"legend-sq",style:"background:"+c}),t); }
function nicheTile(n){
  const active=S.activeNiche===n.niche;
  const chips=[];
  if(n.playbook)chips.push(readyChip("var(--ok)","плейбук"));
  if(n.videos)chips.push(readyChip("var(--acc)",n.videos+" видео"));
  if(!n.playbook&&!n.videos)chips.push(el("span",{class:"chip",style:"color:var(--err);border-color:var(--bd-err);background:var(--err-bg);"},"нет плейбука"));
  const tile=el("div",{class:"card",style:"padding:15px;cursor:pointer;"+(active?"border:1.5px solid var(--acc);box-shadow:0 0 0 3px rgba(124,116,255,.10);":""),
    onclick:()=>{ S.activeNiche=n.niche; render(); }},
    el("div",{class:"row",style:"justify-content:space-between;"},
      el("span",{style:"font-size:22px;"},n.emoji||NICHE_EMOJI[n.niche]||"📦"),
      active?el("span",{class:"badge",style:"background:var(--acc);color:#fff;"},"АКТИВНА"):el("span",{class:"mono",style:"font-size:9px;color:var(--tx-lo);"},n.gens+" ген")),
    el("div",{style:"font-size:14.5px;font-weight:600;margin-top:8px;"},n.label||n.niche),
    el("div",{class:"mono",style:"font-size:10px;color:var(--tx-lo);margin-top:2px;"},(n.videos||0)+" видео · "+(n.templates||0)+" шаблонов"),
    el("div",{class:"row",style:"gap:6px;flex-wrap:wrap;margin-top:10px;"},...chips));
  return tile;
}
function readyChip(c,t){ return el("span",{class:"chip",style:"border-color:"+c+";color:"+c},t); }
async function loadProducts(plist){
  const d=await api("/products");
  plist.innerHTML="";
  const items=(d.items||[]).filter(p=>p.niche===S.activeNiche).slice(0,12);
  if(!items.length){ plist.appendChild(emptyBox("нет товаров в нише «"+S.activeNiche+"»")); return; }
  items.forEach(p=>plist.appendChild(productCard(p)));
}
function productCard(p){
  return el("div",{class:"card",style:"padding:11px;display:flex;gap:11px;align-items:center;"},
    el("div",{class:"ph",style:"width:54px;height:72px;border-radius:7px;flex:none;overflow:hidden;"+(p.img?"background:#0c0d10;":""),
      html:p.img?'<img src="'+esc(p.img)+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'">':"фото"}),
    el("div",{style:"flex:1;min-width:0;"},
      el("div",{style:"font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"},p.name||p.article),
      el("div",{class:"mono",style:"font-size:10px;color:var(--tx-lo);margin-top:3px;"},"арт "+p.article),
      el("div",{class:"row",style:"gap:6px;margin-top:6px;"},
        el("span",{class:"chip"},NICHE_EMOJI[p.niche]||"📦"),
        el("span",{class:"chip"},p.shop||"WB"))),
    el("button",{class:"btn primary sm",onclick:()=>openFormatFork(p)},"Собрать контент"));
}
function openFormatFork(p){
  S.contentProduct=p;
  const ov=el("div",{style:"position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;",
    onclick:(e)=>{ if(e.target===ov)ov.remove(); }});
  const pick=(fmt)=>{ ov.remove(); toast("Формат: "+fmt+" → анализ конкурентов"); S.activeNiche=p.niche; go("compete"); };
  ov.appendChild(el("div",{class:"card",style:"padding:22px;width:420px;"},
    el("div",{style:"font-size:16px;font-weight:600;margin-bottom:4px;"},"Собрать контент"),
    el("div",{class:"muted",style:"margin-bottom:16px;"},p.name||p.article),
    el("div",{class:"sec-title"},"Выбери формат"),
    el("div",{class:"grid",style:"grid-template-columns:repeat(3,1fr);"},
      fmtCard("🎬","Видео","клон конкурента → граф",()=>pick("Видео")),
      fmtCard("🖼","Карусель","слайды с хуком",()=>pick("Карусель")),
      fmtCard("📌","Статик","один кадр",()=>pick("Статик")))));
  document.body.appendChild(ov);
}
function fmtCard(ic,t,sub,on){ return el("div",{class:"card",style:"padding:14px;text-align:center;cursor:pointer;background:var(--bg-node);",onclick:on},
  el("div",{style:"font-size:26px;"},ic),el("div",{style:"font-size:13px;font-weight:600;margin-top:6px;"},t),el("div",{class:"mono",style:"font-size:9.5px;color:var(--tx-lo);margin-top:3px;"},sub)); }

async function renderMarketer(aside){
  aside.innerHTML="";
  aside.appendChild(el("div",{class:"row",style:"gap:9px;margin-bottom:14px;"},
    el("div",{style:"width:34px;height:34px;border-radius:9px;background:var(--acc-soft);border:1px solid var(--bd-acc);display:flex;align-items:center;justify-content:center;font-size:18px;"},"🧠"),
    el("div",{},el("div",{style:"font-size:13px;font-weight:600;"},"Главный маркетолог"),el("div",{class:"mono",style:"font-size:9.5px;color:var(--tx-lo);"},"ниша · "+S.activeNiche))));
  const body=el("div",{}); aside.appendChild(body);
  body.appendChild(loadingCard("маркетолог изучает нишу…"));
  const niche=S.activeNiche;
  const b=await api("/niche-brief?niche="+encodeURIComponent(niche));
  body.innerHTML="";
  if(b.error||!b.brief){ body.appendChild(emptyBox(b.error||"нет данных по нише — запусти разбор"));
    body.appendChild(el("button",{class:"btn sm",style:"margin-top:10px;",onclick:()=>renderMarketer(aside)},"↻ Повторить")); return; }
  const br=b.brief;
  body.appendChild(el("div",{class:"sec-title",style:"color:var(--acc);"},"Что заходит"));
  body.appendChild(el("div",{style:"font-size:12.5px;line-height:1.55;color:var(--tx-bd);margin-bottom:16px;"},br.summary||"—"));
  if(Array.isArray(br.viral_examples)&&br.viral_examples.length){
    body.appendChild(el("div",{class:"sec-title"},"Примеры конкурентов"));
    const g=el("div",{class:"grid",style:"grid-template-columns:repeat(2,1fr);margin-bottom:16px;"});
    br.viral_examples.slice(0,4).forEach(v=>{
      g.appendChild(el("a",{href:v.url||"#",target:"_blank",class:"card",style:"overflow:hidden;text-decoration:none;color:inherit;background:var(--bg-node);"},
        el("div",{class:"ph",style:"aspect-ratio:9/13;position:relative;"},
          el("span",{class:"badge",style:"position:absolute;top:6px;left:6px;background:var(--ok);color:#0c0d10;"},fmtViews(v.score? v.score*100000 : 0)||"viral")),
        el("div",{style:"padding:7px 8px;font-size:10.5px;color:var(--tx-mid);line-height:1.35;"},(v.why||"").slice(0,60))));
    });
    body.appendChild(g);
  }
  if(Array.isArray(br.content_recommendations)&&br.content_recommendations.length){
    body.appendChild(el("div",{class:"sec-title"},"Рекомендации контента"));
    const c=el("div",{class:"row",style:"gap:6px;flex-wrap:wrap;margin-bottom:14px;"});
    br.content_recommendations.slice(0,5).forEach(r=>c.appendChild(el("span",{class:"chip",style:"background:var(--acc-soft);border-color:var(--bd-acc);color:var(--acc-lt);"},"＋ "+(r.format||r.type))));
    body.appendChild(c);
  }
  if(Array.isArray(br.distribution)&&br.distribution.length){
    body.appendChild(el("div",{class:"sec-title"},"Дистрибуция"));
    const c=el("div",{class:"row",style:"gap:6px;flex-wrap:wrap;"});
    br.distribution.slice(0,4).forEach(d=>c.appendChild(el("span",{class:"chip"},"→ "+(d.platform||"")+" "+(d.cadence||""))));
    body.appendChild(c);
  }
  if(b.cached)body.appendChild(el("div",{class:"mono",style:"font-size:9px;color:var(--tx-lo2);margin-top:14px;"},"кеш · обновляется еженедельно"));
}

//==================== 02 · COMPETE / DECOMPOSE ====================

async function pollPreview(n,token,c){
