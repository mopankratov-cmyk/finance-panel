<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODA/studio — нод-студия виральных видео</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0c0d10; --bg-panel:#101216; --bg-chip:#16191f; --bg-card:#15171c; --bg-node:#181b21; --bg-input:#1f232b; --bg-hover:#2b313b;
  --bd:#21262e; --bd2:#2b313b; --bd3:#333a45; --bd-acc:#2b2a45; --bd-err:#3a2420;
  --tx-hi:#e8eaee; --tx-bd:#c2c7cf; --tx-mid:#9aa0ab; --tx-mid2:#98a0ab; --tx-lo:#7c828c; --tx-lo2:#5c636e; --tx-lo3:#4f5662;
  --acc:#7c74ff; --acc-lt:#9a93ff; --acc-soft:rgba(124,116,255,.12);
  --ok:#46c08f; --ok-bg:#13261d; --warn:#d6a94e; --warn-bg:#241f12; --err:#e5604f; --err-bg:#211a1a;
  --p-video:#5b9cf2; --p-audio:#46c08f; --p-image:#d6a94e; --p-script:#b078ef; --p-caption:#ef6fa6; --p-product:#3fb9c2;
  --vio-bg:#1a1830;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg-deep);font-family:var(--sans);color:var(--tx-hi);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2b313b;border-radius:6px;border:2px solid #0c0d10;}
::-webkit-scrollbar-thumb:hover{background:#3a414d;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes shimmer{0%{background-position:-480px 0;}100%{background-position:480px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes dash{to{stroke-dashoffset:-16;}}
.mono{font-family:var(--mono);}
.app{display:flex;height:100vh;width:100%;}
/* ---- RAIL ---- */
.rail{width:236px;flex:none;background:var(--bg-panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;}
.rail-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#7c74ff,#5a52d8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;}
.nav-cap{padding:14px 12px 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-lo3);font-weight:600;}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.12s;background:none;text-align:left;font-family:inherit;color:var(--tx-hi);}
.nav-item:hover{background:#15171c;}
.nav-item.active{background:var(--acc-soft);border-color:var(--bd-acc);}
.nav-chip{width:26px;height:26px;flex:none;border-radius:7px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--tx-mid);}
.nav-item.active .nav-chip{background:var(--acc);color:#fff;}
.nav-tt{font-size:13px;font-weight:500;line-height:1.15;}
.nav-st{font-size:10.5px;color:var(--tx-lo2);font-family:var(--mono);margin-top:2px;}
.rail-foot{flex:none;padding:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px;}
.bar{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7c74ff,#9a93ff);}
/* ---- MAIN ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-deep);}
.hdr{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;border-bottom:1px solid var(--bd);}
.hdr-l{display:flex;align-items:center;gap:10px;}
.hdr-t{font-size:15px;font-weight:600;}
.meta-chip{font-size:11px;font-family:var(--mono);color:var(--tx-lo2);background:var(--bg-chip);border:1px solid var(--bd);padding:3px 8px;border-radius:5px;}
.hdr-r{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:thin;}
.hdr-r::-webkit-scrollbar{height:5px;} .hdr-r::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:3px;}
.body{flex:1;min-height:0;display:flex;overflow:hidden;}
.scroll{flex:1;min-width:0;overflow-y:auto;padding:22px;}
.aside{flex:none;border-left:1px solid var(--bd);background:var(--bg-panel);overflow-y:auto;}
	.app.compact .assist{display:none;}
	.app.compact .scroll{padding:14px;}
	.app.compact .hdr{padding:0 16px;}
	button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
	.hdr-l{flex:none;min-width:188px;}
	.hdr-r{flex:1;justify-content:flex-end;min-width:0;}
	.header-search{flex:1 1 330px;max-width:430px;min-width:220px;}
	.header-action-row{display:flex;align-items:center;gap:8px;flex:none;}
	.header-tools{display:flex;align-items:center;gap:6px;flex:none;}
	.system-pill{min-height:34px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg-chip);color:var(--tx-hi);padding:6px 10px;font-family:var(--sans);font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;max-width:230px;}
	.system-pill:hover{background:var(--bg-hover);}
	.system-pill .dot{width:8px;height:8px;border:none;}
	.system-pill .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
	.health-banner{padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;border-radius:10px;}
	.health-banner.healthy{border-color:rgba(70,192,143,.22);background:rgba(70,192,143,.06);}
	.health-banner.degraded{border-color:rgba(214,169,78,.36);background:rgba(214,169,78,.07);}
	.health-banner.critical{border-color:rgba(229,96,79,.46);background:rgba(229,96,79,.08);}
	.health-main{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
	.health-title{font-size:13px;font-weight:700;line-height:1.3;}
	.health-copy{font-size:11.5px;line-height:1.45;color:var(--tx-bd);margin-top:3px;}
	.health-details{border-top:1px solid var(--bd);padding-top:8px;}
	.health-details>summary{cursor:pointer;color:var(--tx-mid);font-size:11px;font-weight:600;list-style:none;}
	.health-details>summary::-webkit-details-marker{display:none;}
	.health-codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
	.niche-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px;}
	.nicheTile{text-align:left;cursor:pointer;font-family:inherit;color:var(--tx-hi);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:11px;background:var(--bg-card);border:1px solid var(--bd);transition:border-color .14s,background .14s,box-shadow .14s;}
	.nicheTile:hover{background:var(--bg-node);border-color:var(--bd3);}
	.nicheTile.active{background:var(--bg-node);border-color:var(--acc);box-shadow:0 0 0 2px rgba(124,116,255,.12);}
	.niche-arrow{font-size:14px;color:var(--tx-lo2);}
	.nicheTile.active .niche-arrow{color:var(--acc-lt);}
	.filter-row{display:flex;gap:4px;background:var(--bg-chip);border:1px solid var(--bd);border-radius:8px;padding:3px;}
	.product-card{display:flex;gap:14px;padding:12px 13px;align-items:center;border-radius:10px;}
	.product-gaps{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
	.product-gap-chip{font-size:10.5px;color:var(--warn);background:var(--warn-bg);padding:3px 7px;border-radius:5px;font-family:var(--mono);}
	.marketer-card{padding:13px;margin-bottom:14px;}
	.marketer-lead{margin:0;font-size:12.5px;line-height:1.6;color:var(--tx-bd);}
	.marketer-details{margin-top:9px;border-top:1px solid var(--bd);padding-top:8px;}
	.marketer-details>summary{cursor:pointer;color:var(--acc-lt);font-size:11px;font-weight:600;list-style:none;}
	.marketer-details>summary::-webkit-details-marker{display:none;}
	.rec-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
	.rec-card{padding:10px 11px;background:var(--bg-node);border-color:var(--bd2);}
	.rec-card .rec-title{font-size:10px;color:var(--acc-lt);font-family:var(--mono);margin-bottom:5px;}
	.rec-card .rec-text{font-size:11.5px;color:var(--tx-bd);line-height:1.45;}
	@media (min-width:1700px){.niche-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
	@media (max-width:1100px){
	  .body{display:block;overflow-y:auto;}
	  .body>.scroll{height:auto;overflow:visible;}
	  .aside{width:auto!important;border-left:none;border-top:1px solid var(--bd);max-height:none;}
	  .hdr{height:auto;min-height:56px;align-items:flex-start;flex-wrap:wrap;padding:10px 14px;}
	  .hdr-l{min-width:0;}
	  .hdr-r{width:100%;justify-content:flex-start;flex-wrap:wrap;}
	  .header-search{flex-basis:100%;max-width:none;}
	}
	@media (max-width:900px){
	  .rail{width:68px;}
	  .rail-head{justify-content:center;padding:0;overflow:hidden;}
	  .rail-head>.logo{display:flex!important;}
	  .rail-head>div:not(.logo),.nav-cap,.nav-tt,.nav-st,.rail-foot{display:none!important;}
	  .nav{padding:8px;}
	  .nav-item{justify-content:center;padding:8px;}
	  .nav-chip{width:30px;height:30px;}
	}
	@media (max-width:700px){
	  .hdr{display:grid;grid-template-columns:1fr;padding:10px;}
	  .hdr-l{width:100%;}
	  .hdr-r{display:grid;grid-template-columns:1fr;overflow:visible;}
	  .header-search{width:100%;min-width:0;}
	  .header-action-row{display:grid;grid-template-columns:1fr;gap:6px;width:100%;}
	  .header-action-row .btn{justify-content:center;}
	  .system-pill{width:100%;max-width:none;}
	  .hdr-r>.btn.sm{width:100%;justify-content:center;}
	  .header-tools{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:6px;}
	  .guide-btn{justify-content:center;margin-left:0;}
	  .health-main{flex-direction:column;}
	  .niche-grid{grid-template-columns:1fr;}
	  .product-card{align-items:flex-start;}
	  .product-card .btn{align-self:center;}
	}
	/* ---- atoms ---- */
.btn{font-family:var(--sans);font-size:12.5px;font-weight:600;border-radius:7px;padding:8px 13px;cursor:pointer;border:1px solid var(--bd2);background:var(--bg-input);color:var(--tx-hi);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{background:#252a33;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{background:var(--bg-input);}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn.primary:hover{background:#6b63ef;}
.btn.prim{border-color:var(--bd-acc);background:var(--acc-soft);color:var(--acc-lt);}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140d;}
.btn.sm{padding:6px 10px;font-size:11.5px;}
.input{background:var(--bg-input);border:1px solid var(--bd2);border-radius:7px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:9px 11px;outline:none;width:100%;}
.input:focus{border-color:var(--acc);}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--bg-chip);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;color:var(--tx-lo2);font-size:12.5px;}
.sec-h{font-size:13px;font-weight:600;color:var(--tx-mid2);letter-spacing:.3px;margin:0;}
.sec-cap{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx-lo3);font-weight:600;}
.cnt{color:var(--tx-lo3);font-family:var(--mono);font-weight:400;}
.ph{background:repeating-linear-gradient(135deg,#23272f 0 8px,#1d2128 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--tx-lo3);font-size:9px;font-family:var(--mono);}
.skel{background:linear-gradient(90deg,#181b21 25%,#22262e 37%,#181b21 63%);background-size:480px 100%;animation:shimmer 1.4s infinite linear;}
.spinner{width:22px;height:22px;border:2.5px solid #2b313b;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;}
.muted{color:var(--tx-lo);font-size:12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;color:var(--tx-lo);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-node);border:1px solid var(--bd-acc);color:var(--tx-hi);padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:99;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;}
.card{background:var(--bg-card);border:1px solid var(--bd);border-radius:11px;}
.tbadge{font-size:9px;font-family:var(--mono);color:#0c0d10;padding:2px 6px;border-radius:4px;font-weight:600;}
.dot{border-radius:50%;border:2px solid var(--bg-deep);flex:none;}
.sq{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none;}
.legend{font-size:11px;color:var(--tx-lo);display:flex;align-items:center;gap:5px;}
.rchip{font-size:10px;display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px;}
/* slider */
.sld{position:relative;height:5px;border-radius:3px;background:var(--bd2);cursor:pointer;}
.sld>.fill{height:100%;border-radius:3px;background:var(--acc);}
.sld>.knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--tx-hi);border:3px solid var(--acc);}
/* toggle */
.tog{width:38px;height:21px;border-radius:11px;background:var(--bd2);position:relative;cursor:pointer;transition:.15s;flex:none;}
.tog>i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--tx-lo2);transition:.15s;}
.tog.on{background:var(--acc);} .tog.on>i{left:19px;background:#fff;}
/* dropdown (styled select wrapper) */
.dd{position:relative;}
.dd>select{appearance:none;-webkit-appearance:none;background:var(--bg-input);border:1px solid var(--bd2);border-radius:7px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:9px 28px 9px 11px;width:100%;cursor:pointer;}
.dd>.cv{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--tx-lo2);pointer-events:none;}
.flbl{font-size:11px;color:var(--tx-mid);margin-bottom:6px;}
/* inspector group */
.grp{margin-bottom:11px;background:var(--bg-card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;}
.grp-h.open{border-bottom:1px solid var(--bd);}
.grp-t{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--tx-bd);}
.grp-b{padding:13px;display:flex;flex-direction:column;gap:13px;}
.chev{color:var(--tx-lo2);font-size:11px;transition:.15s;}
/* ---- guide-btn (точка входа проводника в шапке) ---- */
.guide-btn{font-family:var(--sans);font-size:11.5px;font-weight:500;border-radius:7px;padding:5px 9px;cursor:pointer;border:1px solid var(--bd-acc);background:var(--acc-soft);color:var(--acc-lt);transition:.12s;display:inline-flex;align-items:center;gap:5px;margin-left:2px;}
.guide-btn:hover{background:rgba(124,116,255,.2);border-color:var(--acc);}
/* ---- ASSIST (проводник) ---- */
.assist{width:300px;flex:none;background:var(--bg-panel);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;transition:width .14s;}
.assist.collapsed{width:46px;}
.assist.collapsed .assist-body{display:none;}
.assist-head{height:56px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px 0 14px;border-bottom:1px solid var(--bd);}
.assist-head .ttl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.assist-head .dotlive{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;animation:pulseDot 2s infinite;}
.assist-col{flex:1;min-height:0;display:flex;flex-direction:column;}
.assist-body{flex:1;min-height:0;display:flex;flex-direction:column;}
.assist-step{flex:none;padding:13px 14px;border-bottom:1px solid var(--bd);}
.astep-cap{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--acc-lt);font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.astep-t{font-size:13px;font-weight:600;line-height:1.35;color:var(--tx-hi);}
.astep-why{font-size:11.5px;color:var(--tx-mid);line-height:1.45;margin-top:6px;}
.astep-cta{margin-top:10px;}
.assist-thread{flex:1;min-height:0;overflow-y:auto;padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
.assist-thread .hint0{font-size:11.5px;color:var(--tx-lo);line-height:1.5;}
.assist-chip{align-self:flex-start;font-size:11px;color:var(--acc-lt);background:var(--acc-soft);border:1px solid var(--bd-acc);padding:6px 9px;border-radius:7px;cursor:pointer;line-height:1.3;text-align:left;}
.assist-chip:hover{background:rgba(124,116,255,.18);}
.bub{max-width:88%;font-size:12px;line-height:1.5;padding:8px 11px;border-radius:11px;white-space:pre-wrap;word-break:break-word;}
.bub.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px;}
.bub.a{align-self:flex-start;background:var(--bg-card);border:1px solid var(--bd);color:var(--tx-bd);border-bottom-left-radius:4px;}
.bub.a .cur{display:inline-block;width:6px;height:13px;background:var(--acc-lt);vertical-align:text-bottom;animation:pulseDot 1s infinite;margin-left:1px;}
.bub.a.intro{border-left:2px solid var(--acc);background:var(--vio-bg);}
.intro-acts{display:flex;flex-direction:column;gap:6px;align-self:stretch;}
.assist-chip.live{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;}
.assist-chip.live:hover{background:#6b63ef;}
@keyframes headPing{0%,100%{background:transparent;}28%{background:var(--acc-soft);}}
.assist-head.ping{animation:headPing 1.1s ease;}
.assist-input{flex:none;border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;}
.assist-input textarea{flex:1;background:var(--bg-input);border:1px solid var(--bd2);border-radius:9px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:9px 11px;outline:none;resize:none;max-height:120px;line-height:1.4;}
.assist-input textarea:focus{border-color:var(--acc);}
.assist-send{flex:none;width:34px;height:34px;border-radius:9px;border:none;background:var(--acc);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.assist-send:hover{background:#6b63ef;} .assist-send:disabled{opacity:.4;cursor:default;}
.assist-collapsed-tab{display:none;flex-direction:column;align-items:center;gap:14px;padding-top:14px;}
.assist.collapsed .assist-collapsed-tab{display:flex;}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="logo">N</div>
      <div style="display:flex;flex-direction:column;line-height:1.1;">
        <span style="font-size:13px;font-weight:600;letter-spacing:.2px;">NODA<span style="color:var(--acc);">/</span>studio</span>
        <span class="mono" style="font-size:10px;color:var(--tx-lo2);margin-top:2px;">завод коротких роликов</span>
      </div>
    </div>
    <div class="nav-cap">Экраны</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx-lo);">
        <span class="mono">Балансы сервисов</span><span class="mono" style="color:var(--acc-lt);font-weight:600;cursor:pointer;" id="budget-val" onclick="go('balances')">экран 07 →</span>
      </div>
      <div class="bar"><i id="budget-bar" style="width:73%"></i></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">

function fmtSecAgo(sec){
  if(sec==null) return "—";
  if(sec < 60) return sec + "с";
  const m = Math.floor(sec / 60);
  const r = sec % 60;
  return m + "м" + (r ? " " + r + "с" : "");
}

async function pollStatic(job){
  for(let i=0;i<40;i++){
    await new Promise(s=>setTimeout(s,3000));
    if(S.screen!=="static")return;
    const qs=new URLSearchParams({id:String(job.id),format:String(job.format||""),article:String(job.article||""),headline:String(job.headline||""),niche:String(job.niche||"")});
    const s=await api("/static-status?"+qs.toString());
    if(s&&s.status==="done"&&s.videoUrl){ job.url=s.videoUrl; renderStaticResults(); return; }
    if(s&&s.status==="error"&&s.retryable===false){ job.error=s.error||"ошибка рендера"; renderStaticResults(); return; }
  }
  job.error="таймаут рендера"; renderStaticResults();
}

function splitBriefText(text){
  const src=String(text||"").replace(/\s+/g," ").trim();
  if(!src)return {lead:"—",rest:""};
  const parts=src.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[src];
  const lead=parts.slice(0,2).join(" ").trim();
  const rest=parts.slice(2).join(" ").trim();
  return {lead:lead||src,rest};
}
function recText(r){

}
function recTitle(r,i){

  return "рекомендация "+(i+1);

const assistMsgs=[]; // история чата {role,content}

function resetAssistantThread(nextScreen){
  assistMsgs.length=0;
  const thread=document.getElementById("assist-thread");
  if(!thread)return;
  thread.innerHTML="";
  const screenName=(SCREENS.find(s=>s.id===nextScreen)||{}).tt||nextScreen;
  thread.appendChild(el("div",{class:"mono",style:"font-size:10px;color:var(--tx-lo3);text-align:center;padding:8px 0;"},"— переход: "+screenName+" —"));

function clearForeignPreviewState(n,nextTool){
  const p=S.preview[n.id];
  if(!p||!p.tool||p.tool===nextTool)return;
  if(p.status==="error"||p.status==="in_progress") delete S.preview[n.id];
}

// Компактный дайджест состояния S → «глаза» проводника (что у юзера прямо сейчас).
function assistantContext(){
  const rec=S.recipe&&S.recipe.recipe, nodes=(S.recipe&&S.recipe.nodes)||[];
  const sel=S.selectedNode, run=S.run, d=S.decompose;
  const withTool=nodes.filter(n=>n&&n.tool).length;
  const withPrev=nodes.filter(n=>n&&(S.preview[n.id]&&S.preview[n.id].url)).length;
  return {
    screen:S.screen, screenName:(SCREENS.find(s=>s.id===S.screen)||{}).tt||S.screen,
    niche:S.activeNiche, nicheLabel:nicheLabel(S.activeNiche),
    briefReady:!!(S.briefCache&&S.briefCache[S.activeNiche]),
    decompose:d?(d.error?{error:String(d.error).slice(0,80)}:{format:d.format||null,nodes:(d.nodes||[]).length}):null,
    recipe:rec?{id:rec.id,title:rec.title||rec.article||null,nodesTotal:nodes.length,nodesWithTool:withTool,nodesWithPreview:withPrev}:null,
    selectedNode:sel?{id:sel.id,type:nodeTypeLabel(sel.node_type||sel.slot),tool:sel.tool||null,hasPrompt:!!(sel.prompt&&sel.prompt.trim()),hasPreview:!!(S.preview[sel.id]&&S.preview[sel.id].url)}:null,
    run:run?{status:run.status||null,step:run.step||null,otk:(run.otk_score!=null?run.otk_score:(run.otk&&run.otk.score))??null}:null,
    product:S.contentProduct?{name:S.contentProduct.name||null,article:S.contentProduct.article||null}:null,
  };
}

      if(!c.recipe) return {cap:"Шаг · граф",t:"Нет графа — собери на канвасе (03).",why:"Сборка раскладывает ноды графа на таймлайн.",cta:{label:"На канвас (03) →",fn:()=>go("canvas")}};
      if(c.run&&(c.run.status==="running"||c.run.step&&c.run.step!=="done"&&c.run.step!=="failed")) return {cap:"Шаг · идёт сборка",t:`Собираю… шаг: ${runStepLabel(c.run.step||"")}. Дождись ОТК.`,why:"Завод рендерит ноды и сшивает таймлайн. ОТК оценит результат по 5 осям."};
      if(c.run&&c.run.otk!=null) return {cap:"Шаг · ОТК",t:c.run.otk>=7?`ОТК ${c.run.otk}/10 — годен. Опубликуй или сохрани в победители.`:`ОТК ${c.run.otk}/10 — доработай. Хук<7? Вернись на ноду хука (04).`,why:"5 осей: хук, удержание, нативность, бренд, CTA. Слабое звено — точка роста.",chips:["Как поднять балл хука?","Что чаще всего проседает?"]};
      return {cap:"Шаг · запуск",t:"Запусти сборку — кнопка на экране.",why:"Таймлайн авто-разложит ноды по длительности, потом ОТК вынесет вердикт.",chips:["Что проверяет ОТК?"]};
    case "library":
      return {cap:"База",t:"Открой рецепт, чтобы продолжить граф, или начни новый через конкурентов (02).",why:"Рецепты — сохранённые графы-шаблоны. Удобно переиспользовать удачную структуру.",cta:{label:"К конкурентам (02) →",fn:()=>go("compete")}};
    case "balances":
      return {cap:"Балансы",t:"Следи за остатками по сервисам. Сервис на нуле — генерация по нему встанет.",why:"Seedance/Kling/Creatify/Shotstack/FAL платные. Пустой баланс = упавшая нода в сборке."};
    case "worker":
      return {cap:"Пульс завода",t:"Смотри на пульс и живые прогоны завода. Если пульс уйдёт в `молчит` или `потерян`, надо проверять передатчик пульса или перезапуск воркера.",why:"Это экран живого контроля: видно, идут ли реальные прогоны, где они застряли и когда воркер перестал отвечать. Следующий шаг обычно либо разобрать зависший прогон, либо чинить путь пульса.",chips:["Как читать статус пульса?","Где смотреть живые прогоны?"]};
    case "learn":
      return {cap:"Обучение",t:"Смотри, что завод выучил: победившие хуки, тренд ОТК, пресеты-победители за период.",why:"Это память завода. Переноси удачные хуки и пресеты в новые ролики — повторяешь то, что уже заходило.",chips:["Как применить выученное?","Что показывает тренд ОТК?"]};
    case "ds":
      return {cap:"Дизайн-система",t:"Служебный справочник токенов: цвет, типографика, состояния.",why:"Для разработки интерфейса студии, не для флоу контента."};
    default:
      return {cap:"Экран",t:`Ты на «${c.screenName}».`,why:"Слева — список экранов, справа я подскажу следующий шаг. Спроси, если что неясно."};
  }
}

function refreshAssistStep(){
  const box=document.getElementById("assist-step"); if(!box)return;
  const s=coachNextStep(); box.innerHTML="";
  box.appendChild(el("div",{class:"astep-cap"},el("span",{},"◆"),s.cap||"Следующий шаг"));
  box.appendChild(el("div",{class:"astep-t"},s.t));
  if(s.why)box.appendChild(el("div",{class:"astep-why"},s.why));
  if(s.cta)box.appendChild(el("div",{class:"astep-cta"},el("button",{class:"btn sm primary",onclick:s.cta.fn},s.cta.label)));
  maybeIntroScreen(s); // проводник сам заговаривает при первом заходе на экран
}

// Проактив: при ПЕРВОМ заходе на экран в сессии проводник сам бросает короткий привет
//   + детерминированный «следующий шаг» (бесплатно, без Claude) и предлагает живое
//   объяснение в один тап. Свёрнут — не лезем, только пульснём, что есть что сказать.
function maybeIntroScreen(s){
  const thread=document.getElementById("assist-thread"); if(!thread)return;
  const a=document.getElementById("assist");
  let col=a&&a.classList.contains("collapsed");
  if(!col){ try{ col=localStorage.getItem("noda_assist_col")==="1"; }catch(e){} } // на буте класс ещё не навешен
  const fresh=!assistSeen.has(S.screen); assistSeen.add(S.screen);
  if(col){ if(fresh)pulseAssist(); return; } // свёрнут — не лезем, только пульснём на новом экране
  const c=assistantContext();
  const build=()=>{
    const prod=c.product&&c.product.name?` (товар «${trunc(c.product.name,32)}»)`:"";
    thread.appendChild(el("div",{class:"bub a intro"},`👋 Ты на «${c.screenName}»${prod}. ${s.t}`+(s.why?(" "+s.why):"")));
    const acts=el("div",{class:"intro-acts"});
    acts.appendChild(el("button",{class:"assist-chip live",onclick:explainScreen},"🤖 объяснить подробнее"));
    (s.chips||[]).forEach(q=>acts.appendChild(el("button",{class:"assist-chip",onclick:()=>askAssistant(q)},"💬 "+q)));
    thread.appendChild(acts); thread.scrollTop=thread.scrollHeight;
  };
  if(!assistMsgs.length){ thread.innerHTML=""; build(); if(fresh)pulseAssist(); return; } // нет диалога → тред = интро текущего экрана
  if(fresh){ thread.querySelectorAll(".intro-acts").forEach(e=>e.remove()); build(); pulseAssist(); } // диалог есть → новый экран = хлебная крошка
}
function pulseAssist(){ const h=document.querySelector("#assist .assist-head"); if(!h)return; h.classList.remove("ping"); void h.offsetWidth; h.classList.add("ping"); }
function applyCompact(){
  const a=document.querySelector(".app"); if(!a)return;
  a.classList.toggle("compact",!!S.compact);
}
function toggleCompact(){
  S.compact=!S.compact;
  try{localStorage.setItem("noda_compact",S.compact?"1":"0");}catch(e){}
  if(S.compact && COMPACT_HIDDEN_SCREENS.has(S.screen))S.screen="center";
  applyCompact();
  renderNav();
  render();
}

function assistBubble(role,text){
  const thread=document.getElementById("assist-thread");
  const b=el("div",{class:"bub "+(role==="user"?"u":"a")},text||"");
  thread.appendChild(b); thread.scrollTop=thread.scrollHeight; return b;
}

async function askAssistant(text){
  text=(text||"").trim(); if(!text||assistBusy)return;
  const q=document.getElementById("assist-q"); if(q)q.value="";
  { const th=document.getElementById("assist-thread"); if(th)th.querySelectorAll(".intro-acts").forEach(e=>e.remove()); } // убрать чипы, привет-крошку оставить
  assistBusy=true; const send=document.getElementById("assist-send"); if(send)send.disabled=true;
  assistMsgs.push({role:"user",content:text}); assistBubble("user",text);
  const bub=assistBubble("assistant",""); const cur=el("span",{class:"cur"}); bub.appendChild(cur);
  let acc="";
  try{
    const res=await fetch(API+"/assistant",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ctx:assistantContext(),messages:assistMsgs})});
    const reader=res.body.getReader(); const dec=new TextDecoder();
    for(;;){ const {done,value}=await reader.read(); if(done)break; acc+=dec.decode(value,{stream:true}); bub.textContent=acc; bub.appendChild(cur); const th=document.getElementById("assist-thread"); th.scrollTop=th.scrollHeight; }
  }catch(e){ acc=acc||("⚠ нет связи с проводником: "+String(e).slice(0,100)); }
  cur.remove(); bub.textContent=acc||"…";
  assistMsgs.push({role:"assistant",content:acc});
  assistBusy=false; if(send)send.disabled=false;
  const th=document.getElementById("assist-thread"); if(th)th.scrollTop=th.scrollHeight;
}

function toggleAssist(){
  const a=document.getElementById("assist"); const col=!a.classList.contains("collapsed");
  a.classList.toggle("collapsed",col); try{localStorage.setItem("noda_assist_col",col?"1":"0");}catch(e){}
  const tg=document.getElementById("assist-toggle"); if(tg)tg.textContent=col?"⟨":"⟩";
}

// клик по «🧭 что тут?» в шапке: развернуть панель (если свёрнута) и попросить объяснить текущий экран
function explainScreen(){
  if(S.compact){
    S.compact=false;
    try{localStorage.setItem("noda_compact","0");}catch(e){}
    applyCompact();
    renderNav();
    render();
  }
  const a=document.getElementById("assist"); if(a&&a.classList.contains("collapsed"))toggleAssist();
  askAssistant("Что тут происходит на этом экране? Коротко объясни, что я вижу и что делать дальше.");
}

function mountAssistant(){
  const send=document.getElementById("assist-send"); const q=document.getElementById("assist-q"); const tg=document.getElementById("assist-toggle");
  if(send)send.onclick=()=>askAssistant(q.value);
  if(q){
    q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); askAssistant(q.value); } });
    q.addEventListener("input",()=>{ q.style.height="auto"; q.style.height=Math.min(120,q.scrollHeight)+"px"; });
  }
  if(tg)tg.onclick=toggleAssist;
  let compact=S.compact;
  try{ const saved=localStorage.getItem("noda_compact"); compact=saved==null?true:saved!=="0"; }catch(e){}
  S.compact=compact;
  applyCompact();
  let col=false; try{col=localStorage.getItem("noda_assist_col")==="1";}catch(e){}
  if(col){ document.getElementById("assist").classList.add("collapsed"); if(tg)tg.textContent="⟨"; }
  refreshAssistStep();
  if(compact) render();
}

(async()=>{ await restoreSession(); renderNav(); render(); mountAssistant(); loadObserver().catch(()=>{}); setInterval(()=>loadObserver().catch(()=>{}),60000); })(); // восстановить сессию → отрисовать там, где был → поднять проводника
</script>
