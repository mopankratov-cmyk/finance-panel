<style>
:root{
  --bg-deep:#0c0d10; --bg-panel:#101216; --bg-chip:#16191f; --bg-card:#15171c; --bg-node:#181b21; --bg-input:#1f232b; --bg-hover:#2b313b;
  --bd:#21262e; --bd2:#2b313b; --bd3:#333a45; --bd-acc:#2b2a45; --bd-err:#3a2420;
  --tx-hi:#e8eaee; --tx-bd:#c2c7cf; --tx-mid:#9aa0ab; --tx-mid2:#98a0ab; --tx-lo:#7c828c; --tx-lo2:#5c636e; --tx-lo3:#4f5662;
  --acc:#7c74ff; --acc-lt:#9a93ff; --acc-soft:rgba(124,116,255,.12);
  --ok:#46c08f; --ok-bg:#13261d; --warn:#d6a94e; --warn-bg:#241f12; --err:#e5604f; --err-bg:#211a1a;
  --p-video:#5b9cf2; --p-audio:#46c08f; --p-image:#d6a94e; --p-script:#b078ef; --p-caption:#ef6fa6; --p-product:#3fb9c2;
  --vio-bg:#1a1830;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg-deep);font-family:var(--sans);color:var(--tx-hi);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2b313b;border-radius:6px;border:2px solid #0c0d10;}
::-webkit-scrollbar-thumb:hover{background:#3a414d;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes shimmer{0%{background-position:-480px 0;}100%{background-position:480px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes dash{to{stroke-dashoffset:-16;}}
.mono{font-family:var(--mono);}
.app{display:flex;height:100vh;width:100%;}
/* ---- RAIL ---- */
.rail{width:236px;flex:none;background:var(--bg-panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;}
.rail-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#7c74ff,#5a52d8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;}
.nav-cap{padding:14px 12px 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-lo3);font-weight:600;}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.12s;background:none;text-align:left;font-family:inherit;color:var(--tx-hi);}
.nav-item:hover{background:#15171c;}
.nav-item.active{background:var(--acc-soft);border-color:var(--bd-acc);}
.nav-chip{width:26px;height:26px;flex:none;border-radius:7px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--tx-mid);}
.nav-item.active .nav-chip{background:var(--acc);color:#fff;}
.nav-tt{font-size:13px;font-weight:500;line-height:1.15;}
.nav-st{font-size:10.5px;color:var(--tx-lo2);font-family:var(--mono);margin-top:2px;}
.rail-foot{flex:none;padding:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px;}
.bar{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7c74ff,#9a93ff);}
/* ---- MAIN ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-deep);}
.hdr{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;border-bottom:1px solid var(--bd);}
.hdr-l{display:flex;align-items:center;gap:10px;}
.hdr-t{font-size:15px;font-weight:600;}
.meta-chip{font-size:11px;font-family:var(--mono);color:var(--tx-lo2);background:var(--bg-chip);border:1px solid var(--bd);padding:3px 8px;border-radius:5px;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.body{flex:1;min-height:0;display:flex;overflow:hidden;}
.scroll{flex:1;min-width:0;overflow-y:auto;padding:22px;}
.aside{flex:none;border-left:1px solid var(--bd);background:var(--bg-panel);overflow-y:auto;}
/* ---- atoms ---- */
.btn{font-family:var(--sans);font-size:12.5px;font-weight:600;border-radius:7px;padding:8px 13px;cursor:pointer;border:1px solid var(--bd2);background:var(--bg-input);color:var(--tx-hi);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{background:#252a33;}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn.primary:hover{background:#6b63ef;}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140d;}
.btn.sm{padding:6px 10px;font-size:11.5px;}
.input{background:var(--bg-input);border:1px solid var(--bd2);border-radius:7px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:9px 11px;outline:none;width:100%;}
.input:focus{border-color:var(--acc);}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--bg-chip);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;color:var(--tx-lo2);font-size:12.5px;}
.sec-h{font-size:13px;font-weight:600;color:var(--tx-mid2);letter-spacing:.3px;margin:0;}
.sec-cap{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx-lo3);font-weight:600;}
.cnt{color:var(--tx-lo3);font-family:var(--mono);font-weight:400;}
.ph{background:repeating-linear-gradient(135deg,#23272f 0 8px,#1d2128 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--tx-lo3);font-size:9px;font-family:var(--mono);}
.skel{background:linear-gradient(90deg,#181b21 25%,#22262e 37%,#181b21 63%);background-size:480px 100%;animation:shimmer 1.4s infinite linear;}
.spinner{width:22px;height:22px;border:2.5px solid #2b313b;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;}
.muted{color:var(--tx-lo);font-size:12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;color:var(--tx-lo);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-node);border:1px solid var(--bd-acc);color:var(--tx-hi);padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:99;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;}
.card{background:var(--bg-card);border:1px solid var(--bd);border-radius:11px;}
.tbadge{font-size:9px;font-family:var(--mono);color:#0c0d10;padding:2px 6px;border-radius:4px;font-weight:600;}
.dot{border-radius:50%;border:2px solid var(--bg-deep);flex:none;}
.sq{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none;}
.legend{font-size:11px;color:var(--tx-lo);display:flex;align-items:center;gap:5px;}
.rchip{font-size:10px;display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px;}
/* slider */
.sld{position:relative;height:5px;border-radius:3px;background:var(--bd2);cursor:pointer;}
.sld>.fill{height:100%;border-radius:3px;background:var(--acc);}
.sld>.knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--tx-hi);border:3px solid var(--acc);}
/* toggle */
.tog{width:38px;height:21px;border-radius:11px;background:var(--bd2);position:relative;cursor:pointer;transition:.15s;flex:none;}
.tog>i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--tx-lo2);transition:.15s;}
.tog.on{background:var(--acc);} .tog.on>i{left:19px;background:#fff;}
/* dropdown (styled select wrapper) */
.dd{position:relative;}
.dd>select{appearance:none;-webkit-appearance:none;background:var(--bg-input);border:1px solid var(--bd2);border-radius:7px;color:var(--tx-hi);font-family:var(--sans);font-size:12.5px;padding:9px 28px 9px 11px;width:100%;cursor:pointer;}
.dd>.cv{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--tx-lo2);pointer-events:none;}
.flbl{font-size:11px;color:var(--tx-mid);margin-bottom:6px;}
/* inspector group */
.grp{margin-bottom:11px;background:var(--bg-card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;}
.grp-h.open{border-bottom:1px solid var(--bd);}
.grp-t{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--tx-bd);}
.grp-b{padding:13px;display:flex;flex-direction:column;gap:13px;}
.chev{color:var(--tx-lo2);font-size:11px;transition:.15s;}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="logo">N</div>
      <div style="display:flex;flex-direction:column;line-height:1.1;">
        <span style="font-size:13px;font-weight:600;letter-spacing:.2px;">NODA<span style="color:var(--acc);">/</span>studio</span>
        <span class="mono" style="font-size:10px;color:var(--tx-lo2);margin-top:2px;">viral video graph</span>
      </div>
    </div>
    <div class="nav-cap">Экраны</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx-lo);">
        <span class="mono">Бюджет рендеров <span style="color:var(--tx-lo2);font-size:9px;">демо</span></span><span class="mono" style="color:var(--tx-hi);font-weight:600;" id="budget-val">$182<span style="color:var(--tx-lo2);">/250</span></span>
      </div>
      <div class="bar"><i id="budget-bar" style="width:73%"></i></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <div style="width:24px;height:24px;border-radius:50%;background:var(--bd2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#b9bec7;">А</div>
        <div style="display:flex;flex-direction:column;line-height:1.2;">
          <span style="font-size:12px;font-weight:500;">Алексей · селлер</span>
          <span style="font-size:10px;color:var(--tx-lo2);">WB · 3 ниши</span>
        </div>
      </div>
      <a href="/inferno/patrick-legacy.html" title="Старый кокпит: дистрибуция, аналитика, трендоскоп, аккаунты — функции, которых пока нет в V3" style="display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 8px;border-radius:7px;border:1px solid var(--bd);color:var(--tx-lo);font-size:10.5px;text-decoration:none;background:var(--bg-card);">↩ Старый завод <span style="color:var(--tx-lo2);">· дистрибуция/аналитика</span></a>
    </div>
  </aside>
  <main class="main">
    <header class="hdr" id="hdr"></header>
    <div class="body" id="screen"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
//==================== CORE ====================
const API="/api/factory";
const S={
  screen:"center", niches:[], generations:[], recipes:[], allProducts:null, prodCounts:{}, centerLoaded:false,
  activeNiche:"cosmetics", activeNicheLabel:"",
  feedCache:{}, briefCache:{},
  decompose:null, decomposeLoading:false, decomposeVideo:null, selectedVideo:null,
  recipe:null, selectedNode:null,
  tool:"seedance", toolSchemas:{},
  run:null, preview:{}, contentProduct:null,
};
const SCREENS=[
  {id:"center",chip:"01",tt:"Командный центр",st:"карта осознания"},
  {id:"compete",chip:"02",tt:"Анализ конкурентов",st:"decompose"},
  {id:"canvas",chip:"03",tt:"Нод-канвас",st:"граф видео"},
  {id:"inspector",chip:"04",tt:"Инспектор ноды",st:"настройки"},
  {id:"assembly",chip:"05",tt:"Сборка · ОТК",st:"таймлайн"},
  {id:"library",chip:"06",tt:"База видосов",st:"рецепты"},
  {id:"balances",chip:"07",tt:"Балансы сервисов",st:"сколько осталось $"},
  {id:"ds",chip:"DS",tt:"Дизайн-система",st:"токены"},
];
const NICHE_EMOJI={cosmetics:"💄",clothing:"🧥",toys:"🔫",default:"📦"};
// picker-поля, которые тянут точный список из ЖИВОГО Creatify API (не хардкод)
const LIVE_PICKER={ override_voice:{type:"voices",route:"/creatify-options?type=voices",audio:true}, background_music_url:{type:"musics",route:"/creatify-options?type=musics",audio:true}, visual_style:{type:"templates",route:"/creatify-options?type=templates",builtin:true} };
const _liveOpts={};

async function api(path,opts){ try{ const r=await fetch(API+path,opts); return await r.json().catch(()=>({error:"не JSON"})); }catch(e){ return {error:String(e).slice(0,120)}; } }
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="style")e.style.cssText=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  for(const k of kids){ if(k==null||k===false)continue; e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k); }
  return e;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }
function fmtViews(n){ n=Number(n)||0; return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n); }
function trunc(s,n){ s=String(s==null?"":s); return s.length>n?s.slice(0,n).trimEnd()+"…":s; }
function isVideoUrl(u){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u||"")||/(fal|shotstack|creatify|storage)/i.test(u||"")&&!/\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(u||""); }
// модалка-плеер: даёт ПОСМОТРЕТЬ результат, а не работать вслепую. ext-ссылки (tiktok/reels) — в новую вкладку.
function openMedia(url,opts){ opts=opts||{};
  if(!url){ toast("нет ссылки на медиа"); return; }
  if(opts.external||/^https?:\/\/(www\.)?(tiktok|instagram|youtube|youtu\.be|vk)\./i.test(url)){ window.open(url,"_blank"); return; }
  const isAudio=opts.audio||/\.(mp3|wav|m4a|ogg|aac)(\?|$)/i.test(url);
  const ov=el("div",{style:"position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;",onclick:(e)=>{ if(e.target===ov)ov.remove(); }});
  const vid=opts.video!=null?opts.video:isVideoUrl(url);
  const media=isAudio?el("div",{style:"background:var(--bg-node);border:1px solid var(--bd2);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;"},el("div",{style:"font-size:30px;"},"♪"),el("audio",{src:url,controls:"controls",autoplay:"autoplay",style:"width:320px;"}))
    :vid?el("video",{src:url,controls:"controls",autoplay:"autoplay",playsinline:"playsinline",style:"max-height:88vh;max-width:92vw;border-radius:12px;background:#000;box-shadow:0 18px 60px rgba(0,0,0,.6);"})
    :el("img",{src:url,style:"max-height:88vh;max-width:92vw;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.6);"});
  ov.appendChild(el("div",{style:"display:flex;flex-direction:column;align-items:center;gap:12px;"},media,
    el("div",{style:"display:flex;gap:10px;"},
      el("a",{href:url,target:"_blank",class:"btn sm"},"открыть ↗"),
      el("button",{class:"btn sm",onclick:()=>ov.remove()},"закрыть"))));
  document.addEventListener("keydown",function esc(e){ if(e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown",esc); } });
  document.body.appendChild(ov);
}
function nicheLabel(n){ const f=S.niches.find(x=>x.niche===n); return (f&&f.label)||({cosmetics:"Косметика",clothing:"Одежда",toys:"Игрушки",default:"Прочее"}[n])||n; }

function renderNav(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  SCREENS.forEach(s=>nav.appendChild(el("button",{class:"nav-item"+(S.screen===s.id?" active":""),onclick:()=>go(s.id)},
    el("span",{class:"nav-chip"},s.chip),
    el("span",{style:"display:flex;flex-direction:column;align-items:flex-start;min-width:0;"},el("span",{class:"nav-tt"},s.tt),el("span",{class:"nav-st"},s.st)))));
}
function go(id){ S.screen=id; renderNav(); render(); }
function header(title,meta,right){
  const h=document.getElementById("hdr"); h.innerHTML="";
  const l=el("div",{class:"hdr-l"},el("span",{class:"hdr-t"},title)); if(meta)l.appendChild(el("span",{class:"meta-chip"},meta));
  h.appendChild(l); h.appendChild(right||el("div",{class:"hdr-r"}));
}
function loadingCard(t){ return el("div",{class:"card",style:"padding:18px;display:flex;align-items:center;gap:12px;"},el("div",{class:"spinner"}),el("span",{class:"muted"},t||"загрузка…")); }
function emptyBox(t){ return el("div",{class:"empty"},el("div",{style:"font-size:26px;opacity:.4;"},"◇"),el("div",{style:"font-size:12.5px;max-width:300px;"},t)); }

async function render(){
  const root=document.getElementById("screen"); root.innerHTML="";
  ({center:screenCenter,compete:screenCompete,canvas:screenCanvas,inspector:screenInspector,assembly:screenAssembly,library:screenLibrary,balances:screenBalances,ds:screenDS}[S.screen]||screenCenter)(root);
}

//==================== 01 · COMMAND CENTER ====================
// force=true → принудительная пересборка (кнопка ↻ или жёсткая перезагрузка страницы сбрасывает S).
// Иначе всё, что уже загружено, берётся из памяти — переключение экранов НЕ дёргает сеть/Claude.
async function screenCenter(root, force){
  if(force){ S.centerLoaded=false; S.briefCache={}; }
  header("Командный центр","карта осознания", el("div",{class:"hdr-r"},
    el("div",{class:"searchbox",title:"поиск — скоро",style:"width:240px;opacity:.5;cursor:not-allowed;"},el("span",{style:"font-size:13px;"},"⌕"),el("span",{},"Поиск ниши, товара…")),
    el("button",{class:"btn",title:"принудительно пересобрать данные и разбор ниши",onclick:()=>screenCenter(root,true)},"↻ Обновить"),
    el("button",{class:"btn primary",onclick:()=>toast("Новая ниша — заведи товары в кабинете")},"+ Новая ниша")));
  const left=el("div",{class:"scroll"}), aside=el("div",{class:"aside",style:"width:340px;padding:18px;"});
  root.appendChild(left); root.appendChild(aside);
  const nicheHead=el("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"},
    el("h2",{class:"sec-h"},"НИШИ ",el("span",{class:"cnt"},String(S.niches.length||""))),
    el("div",{style:"display:flex;gap:14px;"},
      el("span",{class:"legend"},el("span",{class:"sq",style:"background:var(--ok)"}),"есть плейбук"),
      el("span",{class:"legend"},el("span",{class:"sq",style:"background:var(--acc)"}),"виральные"),
      el("span",{class:"legend"},el("span",{class:"sq",style:"background:var(--warn)"}),"есть съёмка")));
  left.appendChild(nicheHead);
  const tiles=el("div",{style:"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px;"}); left.appendChild(tiles);

  if(!S.centerLoaded){
    tiles.appendChild(loadingCard("ниши…"));
    const data=await api("/studio"); // быстрый Supabase-запрос; товары (медленный WB API) — отдельно, не блокируем плитки
    S.niches=data.niches||[]; S.generations=data.generations||[]; S.recipes=data.recipes||[];
    S.centerLoaded=true;
    if(S.screen!=="center")return; // ушли с экрана пока грузили
  }
  nicheHead.querySelector(".cnt").textContent=String(S.niches.length);
  tiles.innerHTML="";
  if(!S.niches.length)tiles.appendChild(emptyBox("нет данных — синкни орбиты"));
  S.niches.forEach(n=>tiles.appendChild(nicheTile(n)));

  const prodHead=el("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"},
