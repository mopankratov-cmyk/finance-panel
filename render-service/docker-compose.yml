# Запуск render-worker на любом Docker-хосте (Yandex VM / локально):
#   docker compose -f render-service/docker-compose.yml up -d --build
# Контекст сборки — корень репо (build.context: ..), секреты — из ../.env.local (в образ НЕ попадают).
services:
  render:
    build:
      context: ..
      dockerfile: render-service/Dockerfile
    image: factory-render
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ../.env.local
    # Chrome пишет кадры в /dev/shm; дефолт Docker — 64MB, на 1080×1920 рендер падает. Поднимаем.
    shm_size: "1gb"
    # Тюнинг скорости ОДНОГО рендера — подбери по логу [timing] (см. шапку server.mjs).
    # environment:
    #   RENDER_FRAME_CONCURRENCY: "8"
    #   RENDER_OFFTHREAD_THREADS: "8"
    #   RENDER_SCALE: "1"          # 0.66 ≈ 720p, кратно быстрее
    #   RENDER_X264_PRESET: "faster"
